<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardwala</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Lobster&family=Fredoka+One&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2d7a3a;
    --gold: #d4a017;
    --gold2: #f0c040;
    --cream: #fdf6e3;
    --pink: #e91e8c;
    --blue: #1565c0;
    --red: #c62828;
    --purple: #6a1b9a;
    --teal: #00796b;
    --border: 3px solid var(--gold);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a0a2e;
    background-image:
      radial-gradient(ellipse at 20% 0%, #2d1050 0%, transparent 60%),
      radial-gradient(ellipse at 80% 0%, #0a2a4a 0%, transparent 60%);
    min-height: 100vh;
    font-family: 'Fredoka One', cursive;
    color: #fff;
    padding: 20px;
  }

  header {
    text-align: center;
    padding: 30px 0 20px;
    position: relative;
  }

  header h1 {
    font-family: 'Lobster', cursive;
    font-size: clamp(2.2rem, 6vw, 4rem);
    background: linear-gradient(135deg, #f0c040, #ff6b35, #f0c040);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    letter-spacing: 2px;
  }

  header p {
    color: #c8a0e8;
    font-size: 1rem;
    margin-top: 6px;
    font-family: 'Dancing Script', cursive;
    font-size: 1.2rem;
  }

  .stars {
    font-size: 1.4rem;
    letter-spacing: 8px;
    margin: 8px 0;
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.6; } to { opacity: 1; } }

  .app {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 28px;
    align-items: start;
  }

  /* CONTROLS */
  .controls {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(212, 160, 23, 0.3);
    border-radius: 16px;
    padding: 20px;
    backdrop-filter: blur(10px);
  }

  .controls h2 {
    font-family: 'Lobster', cursive;
    color: var(--gold2);
    font-size: 1.3rem;
    margin-bottom: 16px;
    border-bottom: 1px solid rgba(212,160,23,0.3);
    padding-bottom: 10px;
  }

  .section-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #c8a0e8;
    margin: 16px 0 8px;
  }

  /* Theme grid */
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 4px;
  }

  .theme-btn {
    background: rgba(255,255,255,0.08);
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 8px 4px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: 0.75rem;
  }
  .theme-btn .emoji { font-size: 1.6rem; display: block; margin-bottom: 3px; }
  .theme-btn:hover { border-color: var(--gold); background: rgba(255,255,255,0.14); }
  .theme-btn.active { border-color: var(--gold2); background: rgba(212,160,23,0.2); }

  /* Greeting buttons */
  .greeting-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .greet-btn {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 7px 6px;
    cursor: pointer;
    color: #e0d0ff;
    font-size: 0.72rem;
    font-family: 'Fredoka One', cursive;
    transition: all 0.15s;
    line-height: 1.3;
  }
  .greet-btn:hover { border-color: var(--gold); color: var(--gold2); }
  .greet-btn.active { background: rgba(212,160,23,0.25); border-color: var(--gold2); color: var(--gold2); }

  /* Name inputs */
  .input-row { margin-bottom: 10px; }
  .input-row label { font-size: 0.8rem; color: #c8a0e8; display: block; margin-bottom: 4px; }
  .input-row input, .input-row textarea {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(212,160,23,0.3);
    border-radius: 8px;
    padding: 8px 12px;
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-row input:focus, .input-row textarea:focus { border-color: var(--gold2); }
  .input-row textarea { height: 60px; resize: none; }

  /* Color picker row */
  .color-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .color-swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
  }
  .color-swatch:hover, .color-swatch.active { border-color: #fff; transform: scale(1.2); }

  /* Buttons */
  .btn-generate {
    width: 100%;
    background: linear-gradient(135deg, #d4a017, #f0c040, #d4a017);
    border: none;
    border-radius: 30px;
    padding: 13px;
    font-family: 'Lobster', cursive;
    font-size: 1.2rem;
    color: #1a0a2e;
    cursor: pointer;
    margin-top: 18px;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(212,160,23,0.4);
  }
  .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(212,160,23,0.6); }
  .btn-generate:active { transform: translateY(0); }

  .btn-download {
    width: 100%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 30px;
    padding: 10px;
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    color: #fff;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
  }
  .btn-download:hover { background: rgba(255,255,255,0.18); }

  /* CARD PREVIEW */
  .preview-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .card-wrap {
    position: relative;
    filter: drop-shadow(0 8px 40px rgba(0,0,0,0.6));
    animation: floatCard 4s ease-in-out infinite;
  }
  @keyframes floatCard {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-10px) rotate(1deg); }
  }

  canvas#card {
    border-radius: 12px;
    display: block;
    max-width: 100%;
  }

  .tip {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.4);
    text-align: center;
    font-family: 'Dancing Script', cursive;
  }

  @media (max-width: 700px) {
    .app { grid-template-columns: 1fr; }
    canvas#card { width: 100% !important; height: auto !important; }
  }
</style>
</head>
<body>

<header>
  <div class="stars">🌙 ⭐ 🕌 ⭐ 🌙</div>
  <h1>Eid Card Generator</h1>
  <p>Bring back the magic of paper Eid cards ✉️</p>
</header>

<div class="app">
  <!-- CONTROLS -->
  <div class="controls">
    <h2>🎨 Design Your Card</h2>

    <div class="section-title">Card Theme</div>
    <div class="theme-grid" id="themeGrid">
      <button class="theme-btn active" data-theme="classic">
        <span class="emoji">🌙</span>Classic Green
      </button>
      <button class="theme-btn" data-theme="cinderella">
        <span class="emoji">👸</span>Princess
      </button>
      <button class="theme-btn" data-theme="cartoon">
        <span class="emoji">🐥</span>Cartoon
      </button>
      <button class="theme-btn" data-theme="doraemon">
        <span class="emoji">🤖</span>Doraemon
      </button>
      <button class="theme-btn" data-theme="flower">
        <span class="emoji">🌸</span>Floral
      </button>
      <button class="theme-btn" data-theme="stars">
        <span class="emoji">✨</span>Starry Night
      </button>
    </div>

    <div class="section-title">Border Color</div>
    <div class="color-row" id="borderColors">
      <div class="color-swatch active" data-color="#d4a017" style="background:#d4a017"></div>
      <div class="color-swatch" data-color="#e91e8c" style="background:#e91e8c"></div>
      <div class="color-swatch" data-color="#1565c0" style="background:#1565c0"></div>
      <div class="color-swatch" data-color="#2d7a3a" style="background:#2d7a3a"></div>
      <div class="color-swatch" data-color="#6a1b9a" style="background:#6a1b9a"></div>
      <div class="color-swatch" data-color="#c62828" style="background:#c62828"></div>
      <div class="color-swatch" data-color="#ff6b35" style="background:#ff6b35"></div>
      <div class="color-swatch" data-color="#00796b" style="background:#00796b"></div>
    </div>

    <div class="section-title">Greeting Message</div>
    <div class="greeting-grid" id="greetGrid">
      <button class="greet-btn active" data-greet="eid">Eid Mubarak</button>
      <button class="greet-btn" data-greet="eidkhushi">Eid Mubarak! May joy fill your heart</button>
      <button class="greet-btn" data-greet="bangla">ঈদ মুবারক</button>
      <button class="greet-btn" data-greet="arabic">عيد مبارك</button>
      <button class="greet-btn" data-greet="blessings">Eid Wishes & Blessings</button>
      <button class="greet-btn" data-greet="custom">✏️ Custom...</button>
    </div>

    <div class="input-row" id="customGreetRow" style="display:none; margin-top:8px;">
      <textarea id="customGreet" placeholder="Type your greeting..."></textarea>
    </div>

    <div class="section-title">From / To</div>
    <div class="input-row">
      <label>To:</label>
      <input type="text" id="toName" placeholder="Your friend's name" maxlength="30">
    </div>
    <div class="input-row">
      <label>From:</label>
      <input type="text" id="fromName" placeholder="Your name" maxlength="30">
    </div>

    <button class="btn-generate" onclick="generateCard()">🎉 Generate Card!</button>
    <button class="btn-download" onclick="downloadCard()">⬇️ Download Card</button>
  </div>

  <!-- PREVIEW -->
  <div class="preview-area">
    <div class="card-wrap">
      <canvas id="card" width="560" height="400"></canvas>
    </div>
    <p class="tip">✨ Cards inspired by classic Bangladeshi Eid cards of the 90s & 2000s ✨</p>
  </div>
</div>

<script>
const canvas = document.getElementById('card');
const ctx = canvas.getContext('2d');

let state = {
  theme: 'classic',
  borderColor: '#d4a017',
  greet: 'eid',
  toName: '',
  fromName: '',
  customGreet: ''
};

const greetings = {
  eid: 'Eid Mubarak!',
  eidkhushi: 'Eid Mubarak!\nMay joy fill your heart',
  bangla: 'ঈদ মুবারক',
  arabic: 'عيد مبارك',
  blessings: 'Eid Wishes\n& Blessings',
  custom: ''
};

// === THEME RENDERERS ===

function drawClassic(c) {
  const w = canvas.width, h = canvas.height;
  // Deep green background with texture
  c.fillStyle = '#1a5c2a';
  c.fillRect(0, 0, w, h);

  // Gradient overlay
  let grad = c.createRadialGradient(w/2, h/2, 50, w/2, h/2, w*0.8);
  grad.addColorStop(0, 'rgba(255,255,255,0.05)');
  grad.addColorStop(1, 'rgba(0,0,0,0.3)');
  c.fillStyle = grad;
  c.fillRect(0, 0, w, h);

  // Moon & star motif (top right)
  drawMoon(c, w-90, 60, 40, '#f0c040');
  drawStar5(c, w-50, 50, 12, '#f0c040');
  drawStar5(c, w-130, 80, 8, '#f0c040');

  // Mosque silhouette at bottom
  drawMosque(c, w/2, h-70, 320, 90, 'rgba(0,0,0,0.35)');

  // Decorative corner flowers
  drawFlower(c, 40, 40, 28, '#f0c040', '#fff');
  drawFlower(c, w-40, 40, 28, '#f0c040', '#fff');
  drawFlower(c, 40, h-40, 28, '#f0c040', '#fff');
  drawFlower(c, w-40, h-40, 28, '#f0c040', '#fff');

  // Stars scattered
  for(let i=0;i<18;i++) {
    let sx = 60+Math.sin(i*2.3)*200+Math.cos(i*1.7)*150;
    let sy = 40+Math.cos(i*3.1)*100+Math.sin(i*2.5)*80;
    let size = 2+Math.abs(Math.sin(i))*4;
    drawStar5(c, sx, sy, size, 'rgba(255,230,100,0.6)');
  }
}

function drawCinderella(c) {
  const w = canvas.width, h = canvas.height;
  // Magical blue background
  let bg = c.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, '#1a237e');
  bg.addColorStop(0.5, '#283593');
  bg.addColorStop(1, '#0d47a1');
  c.fillStyle = bg;
  c.fillRect(0, 0, w, h);

  // Sparkle dust
  for(let i=0;i<40;i++) {
    let sx = Math.abs(Math.sin(i*1.9+1)*w);
    let sy = Math.abs(Math.cos(i*2.3+0.5)*h);
    c.fillStyle = `rgba(255,230,100,${0.3+Math.sin(i)*0.4})`;
    c.beginPath();
    c.arc(sx, sy, Math.random()*3+1, 0, Math.PI*2);
    c.fill();
  }

  // Pumpkin carriage hint (simple)
  drawCarriage(c, w*0.75, h*0.6, 80);

  // Wand sparkle
  drawWand(c, 80, 100);

  // Crown at top center
  drawCrown(c, w/2, 36, 44, '#f0c040', '#fff');

  // Rose border elements
  for(let i=0;i<6;i++) {
    drawRose(c, 30, 80+i*52, 14, '#ff80ab');
    drawRose(c, w-30, 80+i*52, 14, '#ff80ab');
  }
}

function drawCartoon(c) {
  const w = canvas.width, h = canvas.height;
  // Sunny yellow
  let bg = c.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#fffde7');
  bg.addColorStop(1, '#fff9c4');
  c.fillStyle = bg;
  c.fillRect(0, 0, w, h);

  // Colorful polka dots background
  const dotColors = ['#ff8a65','#81c784','#64b5f6','#f06292','#ffd54f','#ba68c8'];
  for(let i=0;i<20;i++) {
    let dx = (i*137)%w;
    let dy = (i*89+50)%h;
    c.globalAlpha = 0.25;
    c.fillStyle = dotColors[i%dotColors.length];
    c.beginPath(); c.arc(dx, dy, 18+i%12, 0, Math.PI*2); c.fill();
  }
  c.globalAlpha = 1;

  // Draw cartoon chick (Tweety-like)
  drawChick(c, w*0.15, h*0.45, 55);

  // Draw cartoon bear
  drawBear(c, w*0.82, h*0.48, 50);

  // Balloons
  drawBalloon(c, 80, 80, 30, '#ff5252');
  drawBalloon(c, 130, 60, 25, '#40c4ff');
  drawBalloon(c, w-80, 90, 28, '#69f0ae');
  drawBalloon(c, w-130, 65, 22, '#ff80ab');

  // Confetti
  const confColors = ['#ff5252','#40c4ff','#69f0ae','#ffd740','#e040fb'];
  for(let i=0;i<25;i++) {
    let cx2 = (i*173+40)%w;
    let cy2 = (i*97+20)%(h*0.5);
    c.fillStyle = confColors[i%5];
    c.save();
    c.translate(cx2, cy2);
    c.rotate(i*0.7);
    c.fillRect(-5, -3, 10, 6);
    c.restore();
  }
}

function drawDoraemon(c) {
  const w = canvas.width, h = canvas.height;
  // Blue sky
  let bg = c.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#e3f2fd');
  bg.addColorStop(0.6, '#bbdefb');
  bg.addColorStop(1, '#90caf9');
  c.fillStyle = bg;
  c.fillRect(0, 0, w, h);

  // Clouds
  drawCloud(c, 120, 70, 70, 'rgba(255,255,255,0.9)');
  drawCloud(c, w-150, 90, 60, 'rgba(255,255,255,0.8)');
  drawCloud(c, w/2, 50, 80, 'rgba(255,255,255,0.85)');

  // Green field bottom
  c.fillStyle = '#66bb6a';
  c.beginPath();
  c.ellipse(w/2, h+20, w*0.7, 60, 0, 0, Math.PI*2);
  c.fill();

  // Doraemon-style robot character
  drawDoraBot(c, w*0.2, h*0.55, 65);

  // Bamboo shoots
  drawBamboo(c, w*0.72, h*0.7, 40);
  drawBamboo(c, w*0.82, h*0.72, 30);

  // Small stars
  for(let i=0;i<8;i++) {
    drawStar5(c, 80+(i*70), 30+(i%3)*25, 7, '#ffd740');
  }
}

function drawFloral(c) {
  const w = canvas.width, h = canvas.height;
  // Cream background
  c.fillStyle = '#fdf6e3';
  c.fillRect(0, 0, w, h);

  // Floral vine along borders
  drawVine(c, w, h);

  // Large center roses
  drawRose(c, w/2-60, h/2, 38, '#e91e8c');
  drawRose(c, w/2+60, h/2, 38, '#ad1457');
  drawRose(c, w/2, h/2-45, 32, '#f06292');
  drawRose(c, w/2, h/2+45, 32, '#e91e8c');

  // Leaf accents
  c.fillStyle = '#2e7d32';
  for(let i=0;i<8;i++) {
    let lx = w/2 + Math.cos(i*Math.PI*2/8)*80;
    let ly = h/2 + Math.sin(i*Math.PI*2/8)*50;
    drawLeaf(c, lx, ly, i*Math.PI*2/8, 18, '#4caf50');
  }
}

function drawStarry(c) {
  const w = canvas.width, h = canvas.height;
  // Dark night sky
  c.fillStyle = '#0d0d2b';
  c.fillRect(0, 0, w, h);

  // Milky way band
  let mw = c.createLinearGradient(0, h*0.2, w, h*0.8);
  mw.addColorStop(0, 'transparent');
  mw.addColorStop(0.4, 'rgba(100,80,200,0.15)');
  mw.addColorStop(0.6, 'rgba(120,100,220,0.15)');
  mw.addColorStop(1, 'transparent');
  c.fillStyle = mw;
  c.fillRect(0, 0, w, h);

  // Stars
  for(let i=0;i<80;i++) {
    let sx = Math.abs(Math.sin(i*1.618)*w);
    let sy = Math.abs(Math.cos(i*2.718)*h*0.75);
    let ss = 0.5 + Math.abs(Math.sin(i*3))*2.5;
    c.fillStyle = `rgba(255,255,${200+Math.floor(55*Math.sin(i))},${0.5+0.5*Math.sin(i*0.7)})`;
    c.beginPath(); c.arc(sx, sy, ss, 0, Math.PI*2); c.fill();
  }

  // Large moon
  drawMoon(c, w*0.78, h*0.25, 55, '#fff9c4');

  // Crescent mosque silhouette
  drawMosque(c, w/2, h-50, 340, 100, 'rgba(30,20,80,0.8)');

  // Lanterns
  drawLantern(c, 70, h*0.45, 22, '#ff6b35');
  drawLantern(c, w-70, h*0.45, 22, '#ff6b35');
}

// ===== DRAWING HELPERS =====

function drawMoon(c, x, y, r, col) {
  c.fillStyle = col;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill();
  c.fillStyle = c.createRadialGradient ? 'rgba(0,0,0,0)' : '#000';
  // Crescent cut
  c.save();
  c.globalCompositeOperation = 'destination-out';
  c.fillStyle = 'rgba(0,0,0,0.999)';
  c.beginPath(); c.arc(x+r*0.4, y-r*0.1, r*0.85, 0, Math.PI*2); c.fill();
  c.restore();
  // Re-draw partial moon glow
  c.fillStyle = col;
  c.beginPath(); c.arc(x, y, r, -0.8, 0.8); c.lineTo(x, y); c.fill();
}

function drawStar5(c, x, y, r, col) {
  c.fillStyle = col;
  c.beginPath();
  for(let i=0;i<5;i++) {
    let a = Math.PI/2 + i*Math.PI*2/5;
    let a2 = a + Math.PI/5;
    if(i===0) c.moveTo(x+Math.cos(a)*r, y-Math.sin(a)*r);
    else c.lineTo(x+Math.cos(a)*r, y-Math.sin(a)*r);
    c.lineTo(x+Math.cos(a2)*r*0.4, y-Math.sin(a2)*r*0.4);
  }
  c.closePath(); c.fill();
}

function drawMosque(c, x, y, w2, h2, col) {
  c.fillStyle = col;
  // Base
  c.fillRect(x-w2/2, y-h2*0.3, w2, h2*0.3);
  // Dome
  c.beginPath();
  c.arc(x, y-h2*0.3, h2*0.35, Math.PI, 0);
  c.fill();
  // Side domes
  c.beginPath(); c.arc(x-w2*0.28, y-h2*0.3, h2*0.22, Math.PI, 0); c.fill();
  c.beginPath(); c.arc(x+w2*0.28, y-h2*0.3, h2*0.22, Math.PI, 0); c.fill();
  // Minarets
  c.fillRect(x-w2*0.48, y-h2*0.9, h2*0.08, h2*0.6);
  c.fillRect(x+w2*0.42, y-h2*0.9, h2*0.08, h2*0.6);
  // Minaret tops
  c.beginPath();
  c.moveTo(x-w2*0.44, y-h2*0.9);
  c.lineTo(x-w2*0.48, y-h2);
  c.lineTo(x-w2*0.40, y-h2*0.9);
  c.fill();
  c.beginPath();
  c.moveTo(x+w2*0.46, y-h2*0.9);
  c.lineTo(x+w2*0.44, y-h2);
  c.lineTo(x+w2*0.5, y-h2*0.9);
  c.fill();
}

function drawFlower(c, x, y, r, petal, center) {
  c.fillStyle = petal;
  for(let i=0;i<6;i++) {
    let a = i*Math.PI/3;
    c.beginPath();
    c.ellipse(x+Math.cos(a)*r*0.6, y+Math.sin(a)*r*0.6, r*0.45, r*0.25, a, 0, Math.PI*2);
    c.fill();
  }
  c.fillStyle = center;
  c.beginPath(); c.arc(x, y, r*0.3, 0, Math.PI*2); c.fill();
}

function drawChick(c, x, y, r) {
  // Body
  c.fillStyle = '#ffd600';
  c.beginPath(); c.ellipse(x, y, r*0.8, r, 0, 0, Math.PI*2); c.fill();
  // Head
  c.beginPath(); c.arc(x, y-r*0.85, r*0.55, 0, Math.PI*2); c.fill();
  // Eyes
  c.fillStyle = '#1a1a1a';
  c.beginPath(); c.arc(x-r*0.18, y-r*0.95, r*0.1, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.18, y-r*0.95, r*0.1, 0, Math.PI*2); c.fill();
  // Eye shine
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(x-r*0.15, y-r*0.98, r*0.04, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.21, y-r*0.98, r*0.04, 0, Math.PI*2); c.fill();
  // Beak
  c.fillStyle = '#ff8f00';
  c.beginPath();
  c.moveTo(x, y-r*0.85);
  c.lineTo(x-r*0.15, y-r*0.78);
  c.lineTo(x+r*0.15, y-r*0.78);
  c.closePath(); c.fill();
  // Wings
  c.fillStyle = '#ffca28';
  c.beginPath(); c.ellipse(x-r*0.9, y-r*0.1, r*0.4, r*0.25, -0.6, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.9, y-r*0.1, r*0.4, r*0.25, 0.6, 0, Math.PI*2); c.fill();
}

function drawBear(c, x, y, r) {
  // Body
  c.fillStyle = '#8d6e63';
  c.beginPath(); c.ellipse(x, y, r*0.7, r*0.85, 0, 0, Math.PI*2); c.fill();
  // Belly
  c.fillStyle = '#d7ccc8';
  c.beginPath(); c.ellipse(x, y+r*0.1, r*0.4, r*0.5, 0, 0, Math.PI*2); c.fill();
  // Head
  c.fillStyle = '#8d6e63';
  c.beginPath(); c.arc(x, y-r*0.75, r*0.55, 0, Math.PI*2); c.fill();
  // Ears
  c.beginPath(); c.arc(x-r*0.4, y-r*1.2, r*0.22, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.4, y-r*1.2, r*0.22, 0, Math.PI*2); c.fill();
  c.fillStyle = '#d7ccc8';
  c.beginPath(); c.arc(x-r*0.4, y-r*1.2, r*0.12, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.4, y-r*1.2, r*0.12, 0, Math.PI*2); c.fill();
  // Eyes
  c.fillStyle = '#1a1a1a';
  c.beginPath(); c.arc(x-r*0.2, y-r*0.82, r*0.08, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.2, y-r*0.82, r*0.08, 0, Math.PI*2); c.fill();
  // Nose
  c.fillStyle = '#3e2723';
  c.beginPath(); c.arc(x, y-r*0.68, r*0.1, 0, Math.PI*2); c.fill();
  // Bow tie
  c.fillStyle = '#e91e8c';
  c.beginPath(); c.moveTo(x-r*0.22, y-r*0.18); c.lineTo(x, y-r*0.06); c.lineTo(x-r*0.22, y+r*0.06); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(x+r*0.22, y-r*0.18); c.lineTo(x, y-r*0.06); c.lineTo(x+r*0.22, y+r*0.06); c.closePath(); c.fill();
}

function drawBalloon(c, x, y, r, col) {
  c.fillStyle = col;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill();
  // Shine
  c.fillStyle = 'rgba(255,255,255,0.35)';
  c.beginPath(); c.ellipse(x-r*0.3, y-r*0.3, r*0.25, r*0.15, -0.5, 0, Math.PI*2); c.fill();
  // String
  c.strokeStyle = col;
  c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(x, y+r); c.bezierCurveTo(x+10, y+r+15, x-5, y+r+30, x, y+r+45); c.stroke();
  // Knot
  c.fillStyle = col;
  c.beginPath(); c.arc(x, y+r+2, 3, 0, Math.PI*2); c.fill();
}

function drawRose(c, x, y, r, col) {
  c.fillStyle = col;
  for(let i=0;i<5;i++) {
    let a = i*Math.PI*2/5;
    c.beginPath();
    c.ellipse(x+Math.cos(a)*r*0.5, y+Math.sin(a)*r*0.5, r*0.55, r*0.3, a, 0, Math.PI*2);
    c.fill();
  }
  // Center
  let darker = col.replace('#e91e8c','#880e4f').replace('#f06292','#c2185b').replace('#ad1457','#560027').replace('#ff80ab','#e91e8c');
  c.fillStyle = darker;
  c.beginPath(); c.arc(x, y, r*0.35, 0, Math.PI*2); c.fill();
}

function drawLeaf(c, x, y, angle, size, col) {
  c.fillStyle = col;
  c.save();
  c.translate(x, y); c.rotate(angle);
  c.beginPath();
  c.moveTo(0, -size);
  c.quadraticCurveTo(size*0.7, -size*0.3, 0, size*0.5);
  c.quadraticCurveTo(-size*0.7, -size*0.3, 0, -size);
  c.fill();
  c.restore();
}

function drawVine(c, w, h) {
  c.strokeStyle = '#4caf50';
  c.lineWidth = 2;
  // Top vine
  c.beginPath();
  for(let x=0; x<=w; x+=20) {
    let y = 25 + Math.sin(x*0.1)*8;
    if(x===0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  c.stroke();
  // Bottom vine
  c.beginPath();
  for(let x=0; x<=w; x+=20) {
    let y = h-25 + Math.sin(x*0.1+1)*8;
    if(x===0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  c.stroke();
  // Small leaves along vines
  c.fillStyle = '#66bb6a';
  for(let x=30; x<w; x+=40) {
    let sy = 25 + Math.sin(x*0.1)*8;
    drawLeaf(c, x, sy, Math.PI*0.3, 9, '#4caf50');
    let by = h-25 + Math.sin(x*0.1+1)*8;
    drawLeaf(c, x, by, Math.PI*1.1, 9, '#4caf50');
  }
  // Side vines
  c.beginPath();
  for(let y=0; y<=h; y+=20) {
    let x2 = 25 + Math.sin(y*0.1)*8;
    if(y===0) c.moveTo(x2, y); else c.lineTo(x2, y);
  }
  c.stroke();
  c.beginPath();
  for(let y=0; y<=h; y+=20) {
    let x2 = w-25 + Math.sin(y*0.1+1)*8;
    if(y===0) c.moveTo(x2, y); else c.lineTo(x2, y);
  }
  c.stroke();
  // Corner roses
  drawRose(c, 30, 30, 22, '#e91e8c');
  drawRose(c, w-30, 30, 22, '#ad1457');
  drawRose(c, 30, h-30, 22, '#f06292');
  drawRose(c, w-30, h-30, 22, '#e91e8c');
}

function drawCloud(c, x, y, r, col) {
  c.fillStyle = col;
  c.beginPath(); c.arc(x, y, r*0.6, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x-r*0.5, y+r*0.1, r*0.45, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.5, y+r*0.1, r*0.45, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.25, y+r*0.2, r*0.5, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x-r*0.25, y+r*0.25, r*0.4, 0, Math.PI*2); c.fill();
}

function drawDoraBot(c, x, y, r) {
  // Body (blue robot)
  c.fillStyle = '#1565c0';
  c.beginPath(); c.ellipse(x, y, r*0.7, r*0.85, 0, 0, Math.PI*2); c.fill();
  // White belly
  c.fillStyle = '#fff';
  c.beginPath(); c.ellipse(x, y+r*0.1, r*0.42, r*0.52, 0, 0, Math.PI*2); c.fill();
  // Pocket
  c.strokeStyle = '#90caf9'; c.lineWidth = 2;
  c.beginPath(); c.ellipse(x, y+r*0.25, r*0.28, r*0.2, 0, 0, Math.PI); c.stroke();
  // Head
  c.fillStyle = '#1565c0';
  c.beginPath(); c.arc(x, y-r*0.78, r*0.58, 0, Math.PI*2); c.fill();
  // Face white part
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(x, y-r*0.72, r*0.42, 0, Math.PI*2); c.fill();
  // Eyes
  c.fillStyle = '#1a1a1a';
  c.beginPath(); c.arc(x-r*0.18, y-r*0.88, r*0.12, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.18, y-r*0.88, r*0.12, 0, Math.PI*2); c.fill();
  // Eye whites
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(x-r*0.15, y-r*0.91, r*0.05, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.21, y-r*0.91, r*0.05, 0, Math.PI*2); c.fill();
  // Nose
  c.fillStyle = '#f44336';
  c.beginPath(); c.arc(x, y-r*0.72, r*0.1, 0, Math.PI*2); c.fill();
  // Whiskers
  c.strokeStyle = '#1a1a1a'; c.lineWidth = 1.5;
  [-1,0,1].forEach(i => {
    c.beginPath(); c.moveTo(x-r*0.08, y-r*0.65+i*r*0.08); c.lineTo(x-r*0.5, y-r*0.68+i*r*0.06); c.stroke();
    c.beginPath(); c.moveTo(x+r*0.08, y-r*0.65+i*r*0.08); c.lineTo(x+r*0.5, y-r*0.68+i*r*0.06); c.stroke();
  });
  // Collar
  c.fillStyle = '#f44336';
  c.beginPath(); c.arc(x, y-r*0.2, r*0.65, 0.5, Math.PI-0.5); c.fill();
  c.fillStyle = '#ffd600';
  c.beginPath(); c.arc(x, y-r*0.18, r*0.14, 0, Math.PI*2); c.fill();
  // Arms
  c.fillStyle = '#1565c0';
  c.beginPath(); c.ellipse(x-r*0.92, y-r*0.1, r*0.22, r*0.4, 0.6, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.92, y-r*0.1, r*0.22, r*0.4, -0.6, 0, Math.PI*2); c.fill();
  // Hands (white)
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(x-r*1.05, y+r*0.12, r*0.18, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*1.05, y+r*0.12, r*0.18, 0, Math.PI*2); c.fill();
}

function drawBamboo(c, x, y, h2) {
  c.strokeStyle = '#66bb6a'; c.lineWidth = 8;
  c.beginPath(); c.moveTo(x, y); c.lineTo(x, y-h2*2.5); c.stroke();
  c.strokeStyle = '#a5d6a7'; c.lineWidth = 2;
  for(let i=0; i<5; i++) {
    c.beginPath(); c.moveTo(x-4, y-i*h2*0.55); c.lineTo(x+4, y-i*h2*0.55); c.stroke();
  }
  // Leaves
  c.fillStyle = '#4caf50';
  drawLeaf(c, x, y-h2*2.2, -0.4, 18, '#4caf50');
  drawLeaf(c, x, y-h2*1.7, 0.5, 15, '#66bb6a');
}

function drawCrown(c, x, y, r, col, center) {
  c.fillStyle = col;
  c.beginPath();
  c.moveTo(x-r, y+r*0.4);
  c.lineTo(x-r*0.8, y-r*0.2);
  c.lineTo(x-r*0.55, y+r*0.1);
  c.lineTo(x-r*0.3, y-r*0.6);
  c.lineTo(x, y+r*0.0);
  c.lineTo(x+r*0.3, y-r*0.6);
  c.lineTo(x+r*0.55, y+r*0.1);
  c.lineTo(x+r*0.8, y-r*0.2);
  c.lineTo(x+r, y+r*0.4);
  c.closePath(); c.fill();
  // Gems
  c.fillStyle = '#e91e8c';
  c.beginPath(); c.arc(x, y-r*0.1, r*0.18, 0, Math.PI*2); c.fill();
  c.fillStyle = '#2196f3';
  c.beginPath(); c.arc(x-r*0.5, y+r*0.1, r*0.12, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.5, y+r*0.1, r*0.12, 0, Math.PI*2); c.fill();
}

function drawCarriage(c, x, y, r) {
  // Wheels
  c.strokeStyle = '#f0c040'; c.lineWidth = 3;
  c.beginPath(); c.arc(x-r*0.6, y+r*0.3, r*0.28, 0, Math.PI*2); c.stroke();
  c.beginPath(); c.arc(x+r*0.6, y+r*0.3, r*0.28, 0, Math.PI*2); c.stroke();
  // Body
  c.fillStyle = '#f0c040';
  c.beginPath();
  c.ellipse(x, y, r*0.75, r*0.55, 0, 0, Math.PI*2);
  c.fill();
  // Window
  c.fillStyle = '#90caf9';
  c.beginPath(); c.arc(x, y-r*0.05, r*0.3, 0, Math.PI*2); c.fill();
  c.strokeStyle = '#d4a017'; c.lineWidth = 2;
  c.stroke();
  // Top ornament
  c.fillStyle = '#d4a017';
  c.beginPath(); c.arc(x, y-r*0.55, r*0.12, 0, Math.PI*2); c.fill();
}

function drawWand(c, x, y) {
  c.strokeStyle = '#f0c040'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(x, y+80); c.lineTo(x+40, y); c.stroke();
  drawStar5(c, x+40, y, 18, '#f0c040');
  // Sparkles
  ['#fff','#ffd740','#ff80ab','#80d8ff'].forEach((col,i) => {
    let sx = x+20+Math.cos(i*1.6)*30;
    let sy = y+30+Math.sin(i*1.6)*25;
    drawStar5(c, sx, sy, 6, col);
  });
}

function drawLantern(c, x, y, r, col) {
  // String
  c.strokeStyle = '#aaa'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(x, y-50); c.lineTo(x, y-r*1.2); c.stroke();
  // Glow
  let glow = c.createRadialGradient(x, y, 0, x, y, r*2.5);
  glow.addColorStop(0, col.replace(')', ',0.3)').replace('rgb', 'rgba'));
  glow.addColorStop(1, 'transparent');
  c.fillStyle = glow;
  c.beginPath(); c.arc(x, y, r*2.5, 0, Math.PI*2); c.fill();
  // Body
  c.fillStyle = col;
  c.beginPath();
  c.moveTo(x-r, y-r*0.8);
  c.quadraticCurveTo(x-r*1.2, y, x-r*0.9, y+r*0.9);
  c.lineTo(x+r*0.9, y+r*0.9);
  c.quadraticCurveTo(x+r*1.2, y, x+r, y-r*0.8);
  c.closePath(); c.fill();
  // Shine
  c.fillStyle = 'rgba(255,255,255,0.3)';
  c.beginPath(); c.ellipse(x-r*0.2, y-r*0.2, r*0.25, r*0.5, -0.3, 0, Math.PI*2); c.fill();
  // Top/bottom cap
  c.fillStyle = '#d4a017';
  c.fillRect(x-r*0.5, y-r*0.9, r, r*0.2);
  c.fillRect(x-r*0.5, y+r*0.8, r, r*0.2);
  // Tassel
  c.strokeStyle = col; c.lineWidth = 1.5;
  for(let i=0;i<4;i++) {
    c.beginPath(); c.moveTo(x-r*0.2+i*r*0.12, y+r); c.lineTo(x-r*0.2+i*r*0.12+5, y+r+15); c.stroke();
  }
}

// ===== BORDER =====

function drawBorder(c, w, h, col) {
  // Outer border
  c.strokeStyle = col;
  c.lineWidth = 6;
  c.strokeRect(8, 8, w-16, h-16);

  // Inner thin border
  c.strokeStyle = col;
  c.lineWidth = 1.5;
  c.strokeRect(16, 16, w-32, h-32);

  // Corner diamonds
  [[18,18],[w-18,18],[18,h-18],[w-18,h-18]].forEach(([cx,cy]) => {
    c.fillStyle = col;
    c.save(); c.translate(cx, cy); c.rotate(Math.PI/4);
    c.fillRect(-6, -6, 12, 12);
    c.restore();
  });
}

// ===== TEXT =====

function drawText(c, w, h) {
  const msg = state.greet === 'custom' ? (state.customGreet || 'Eid Mubarak!') : greetings[state.greet];
  const lines = msg.split('\n');

  // Main greeting — white with gold shadow for dark themes, dark for light themes
  const isLight = ['cartoon','flower'].includes(state.theme);
  const textCol = isLight ? '#1a0a2e' : '#fff';
  const shadowCol = isLight ? 'rgba(0,0,0,0.2)' : 'rgba(0,0,0,0.5)';

  // Arabic/Bengali font check
  const isBangla = state.greet === 'bangla';
  const isArabic = state.greet === 'arabic';
  const fontFace = (isBangla || isArabic) ? "'Amiri', serif" : "'Lobster', cursive";

  const fontSize = lines[0].length > 18 ? 28 : lines[0].length > 12 ? 34 : 42;

  c.save();
  c.textAlign = 'center';
  c.textBaseline = 'middle';

  // Gold banner behind text
  const bannerY = h/2 + 10;
  const bannerH = lines.length * (fontSize+10) + 20;
  c.fillStyle = 'rgba(0,0,0,0.22)';
  c.beginPath();
  c.roundRect(w*0.12, bannerY - bannerH/2 - 8, w*0.76, bannerH + 16, 10);
  c.fill();

  lines.forEach((line, i) => {
    const lineY = bannerY + (i - (lines.length-1)/2) * (fontSize+8);
    c.font = `bold ${fontSize}px ${fontFace}`;
    c.fillStyle = shadowCol;
    c.fillText(line, w/2+2, lineY+2);
    c.fillStyle = state.borderColor;
    c.fillText(line, w/2, lineY);
  });

  c.restore();

  // To / From text
  if(state.toName || state.fromName) {
    c.save();
    c.textAlign = 'left';
    c.font = `italic 17px 'Dancing Script', cursive`;
    c.fillStyle = isLight ? 'rgba(0,0,0,0.65)' : 'rgba(255,255,255,0.85)';
    if(state.toName) c.fillText(`To: ${state.toName}`, 30, h-48);
    c.textAlign = 'right';
    if(state.fromName) c.fillText(`From: ${state.fromName}`, w-30, h-28);
    c.restore();
  }
}

// ===== MAIN RENDER =====

function generateCard() {
  state.toName = document.getElementById('toName').value;
  state.fromName = document.getElementById('fromName').value;
  state.customGreet = document.getElementById('customGreet').value;

  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // Draw theme
  const themes = {
    classic: drawClassic,
    cinderella: drawCinderella,
    cartoon: drawCartoon,
    doraemon: drawDoraemon,
    flower: drawFloral,
    stars: drawStarry
  };
  (themes[state.theme] || drawClassic)(ctx);

  // Draw border
  drawBorder(ctx, w, h, state.borderColor);

  // Draw text
  drawText(ctx, w, h);
}

function downloadCard() {
  generateCard();
  const link = document.createElement('a');
  link.download = 'eid-card.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// === UI INTERACTIONS ===

document.getElementById('themeGrid').addEventListener('click', e => {
  const btn = e.target.closest('.theme-btn');
  if(!btn) return;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.theme = btn.dataset.theme;
  generateCard();
});

document.getElementById('borderColors').addEventListener('click', e => {
  const sw = e.target.closest('.color-swatch');
  if(!sw) return;
  document.querySelectorAll('.color-swatch').forEach(b => b.classList.remove('active'));
  sw.classList.add('active');
  state.borderColor = sw.dataset.color;
  generateCard();
});

document.getElementById('greetGrid').addEventListener('click', e => {
  const btn = e.target.closest('.greet-btn');
  if(!btn) return;
  document.querySelectorAll('.greet-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.greet = btn.dataset.greet;
  document.getElementById('customGreetRow').style.display = state.greet==='custom' ? 'block' : 'none';
  generateCard();
});

['toName','fromName','customGreet'].forEach(id => {
  document.getElementById(id).addEventListener('input', generateCard);
});

// Initial render
generateCard();
</script>
