<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>কার্ডওয়ালা – Eid Card Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;700;800&family=Lobster&family=Dancing+Script:wght@700&family=Bangers&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0b1a;
  --panel: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.1);
  --gold: #f0c040;
  --gold2: #d4a017;
  --accent: #ff6b35;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(ellipse 80% 50% at 50% -20%, #1a0a3e 0%, transparent 70%);
  min-height: 100vh;
  font-family: 'Baloo Da 2', cursive;
  color: #fff;
  padding: 16px;
}

/* HEADER */
header {
  text-align: center;
  padding: 24px 0 20px;
}
.header-logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
header h1 {
  font-family: 'Bangers', cursive;
  font-size: clamp(2.4rem, 7vw, 4.2rem);
  letter-spacing: 4px;
  background: linear-gradient(135deg, #f0c040 0%, #ff6b35 50%, #f0c040 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1;
}
.bangla-sub {
  font-family: 'Baloo Da 2', cursive;
  font-size: 1rem;
  color: rgba(255,255,255,0.5);
  letter-spacing: 3px;
  margin-top: 4px;
  text-transform: uppercase;
}
.moon-row { font-size: 1.2rem; margin: 6px 0; letter-spacing: 6px; opacity: 0.8; }

/* LAYOUT */
.app {
  max-width: 1080px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 20px;
  align-items: start;
}

/* SIDEBAR */
.sidebar {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
  backdrop-filter: blur(12px);
  position: sticky;
  top: 16px;
}
.sec-label {
  font-size: 0.68rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  margin: 14px 0 8px;
}
.sec-label:first-child { margin-top: 0; }

/* Character grid */
.char-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}
.char-btn {
  background: rgba(255,255,255,0.06);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 5px 2px;
  cursor: pointer;
  text-align: center;
  transition: all 0.18s;
  color: #fff;
  font-family: 'Baloo Da 2', cursive;
  font-size: 0.6rem;
  line-height: 1.3;
}
.char-btn .ico { font-size: 1.5rem; display: block; }
.char-btn:hover { border-color: var(--gold); background: rgba(255,255,255,0.12); }
.char-btn.active { border-color: var(--gold); background: rgba(240,192,64,0.18); }

/* Color swatches */
.swatch-row { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer;
  transition: all 0.15s;
}
.swatch:hover, .swatch.active { border-color: #fff; transform: scale(1.25); }

/* Greeting pills */
.greet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.greet-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 6px 5px;
  cursor: pointer;
  color: rgba(255,255,255,0.7);
  font-size: 0.68rem;
  font-family: 'Baloo Da 2', cursive;
  transition: all 0.15s; text-align: center;
}
.greet-btn:hover { border-color: var(--gold); color: var(--gold); }
.greet-btn.active { background: rgba(240,192,64,0.2); border-color: var(--gold); color: var(--gold); }

/* Inputs */
.field { margin-bottom: 8px; }
.field label { font-size: 0.72rem; color: rgba(255,255,255,0.45); display: block; margin-bottom: 3px; }
.field input, .field textarea {
  width: 100%;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px; padding: 7px 10px;
  color: #fff; font-family: 'Baloo Da 2', cursive;
  font-size: 0.88rem; outline: none;
  transition: border-color 0.2s;
}
.field input:focus, .field textarea:focus { border-color: var(--gold); }
.field textarea { height: 52px; resize: none; }

/* Action buttons */
.btn-main {
  width: 100%; border: none; border-radius: 30px;
  padding: 12px; cursor: pointer; margin-top: 14px;
  font-family: 'Bangers', cursive; font-size: 1.3rem;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #d4a017, #f0c040, #d4a017);
  color: #0e0b1a;
  box-shadow: 0 4px 20px rgba(240,192,64,0.35);
  transition: all 0.2s;
}
.btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(240,192,64,0.55); }
.btn-sec {
  width: 100%; border: 1px solid rgba(255,255,255,0.2); border-radius: 30px;
  padding: 9px; cursor: pointer; margin-top: 7px;
  font-family: 'Baloo Da 2', cursive; font-size: 0.9rem; font-weight: 700;
  background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8);
  transition: all 0.2s;
}
.btn-sec:hover { background: rgba(255,255,255,0.13); }

/* PREVIEW */
.preview {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.canvas-wrap {
  filter: drop-shadow(0 12px 40px rgba(0,0,0,0.7));
  animation: float 5s ease-in-out infinite;
  width: 100%; max-width: 600px;
}
@keyframes float {
  0%,100% { transform: translateY(0) rotate(-0.5deg); }
  50% { transform: translateY(-10px) rotate(0.5deg); }
}
canvas { border-radius: 14px; display: block; width: 100%; }
.tip { font-size: 0.75rem; color: rgba(255,255,255,0.3); font-family: 'Dancing Script', cursive; font-size: 1rem; }

/* custom greet hidden */
#customBox { display: none; margin-top: 6px; }

@media (max-width: 660px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; }
  .char-grid { grid-template-columns: repeat(5, 1fr); }
}
</style>
</head>
<body>

<header>
  <div class="moon-row">🌙 ✨ 🕌 ✨ 🌙</div>
  <div class="header-logo">
    <h1>কার্ডওয়ালা</h1>
  </div>
  <div class="bangla-sub">Eid Card Generator</div>
</header>

<div class="app">
<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sec-label">Choose Character</div>
  <div class="char-grid" id="charGrid">
    <button class="char-btn active" data-char="spiderman"><span class="ico">🕷️</span>Spider-Man</button>
    <button class="char-btn" data-char="powerrangers"><span class="ico">⚡</span>Power Rangers</button>
    <button class="char-btn" data-char="doraemon"><span class="ico">🤖</span>Doraemon</button>
    <button class="char-btn" data-char="shinchan"><span class="ico">🖍️</span>Shin-chan</button>
    <button class="char-btn" data-char="barbie"><span class="ico">🧚</span>Barbie</button>
    <button class="char-btn" data-char="cinderella"><span class="ico">👸</span>Cinderella</button>
    <button class="char-btn" data-char="aladdin"><span class="ico">🧞</span>Aladdin</button>
    <button class="char-btn" data-char="superman"><span class="ico">🦸</span>Superman</button>
    <button class="char-btn" data-char="batman"><span class="ico">🦇</span>Batman</button>
    <button class="char-btn" data-char="deadpool"><span class="ico">💀</span>Deadpool</button>
  </div>

  <div class="sec-label">Border Color</div>
  <div class="swatch-row" id="swatches">
    <div class="swatch active" data-c="#f0c040" style="background:#f0c040"></div>
    <div class="swatch" data-c="#e53935" style="background:#e53935"></div>
    <div class="swatch" data-c="#1565c0" style="background:#1565c0"></div>
    <div class="swatch" data-c="#2e7d32" style="background:#2e7d32"></div>
    <div class="swatch" data-c="#6a1b9a" style="background:#6a1b9a"></div>
    <div class="swatch" data-c="#ff6b35" style="background:#ff6b35"></div>
    <div class="swatch" data-c="#00838f" style="background:#00838f"></div>
    <div class="swatch" data-c="#e91e8c" style="background:#e91e8c"></div>
    <div class="swatch" data-c="#ffffff" style="background:#fff"></div>
  </div>

  <div class="sec-label">Greeting</div>
  <div class="greet-grid" id="greetGrid">
    <button class="greet-btn active" data-g="eid">Eid Mubarak!</button>
    <button class="greet-btn" data-g="bangla">ঈদ মুবারক</button>
    <button class="greet-btn" data-g="arabic">عيد مبارك</button>
    <button class="greet-btn" data-g="joy">Eid Joy!</button>
    <button class="greet-btn" data-g="blessings">Blessings &amp; Love</button>
    <button class="greet-btn" data-g="custom">✏️ Custom</button>
  </div>
  <div id="customBox">
    <div class="field"><textarea id="customText" placeholder="Type your greeting..."></textarea></div>
  </div>

  <div class="sec-label">To / From</div>
  <div class="field"><label>To</label><input id="toName" placeholder="Friend's name" maxlength="28"></div>
  <div class="field"><label>From</label><input id="fromName" placeholder="Your name" maxlength="28"></div>

  <button class="btn-main" onclick="render()">🎉 Generate!</button>
  <button class="btn-sec" onclick="dl()">⬇ Download PNG</button>
</div>

<!-- PREVIEW -->
<div class="preview">
  <div class="canvas-wrap">
    <canvas id="c" width="600" height="420"></canvas>
  </div>
  <p class="tip">✨ Inspired by real Bangladeshi Eid cards of the 90s & 2000s ✨</p>
</div>
</div>

<script>
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const W = cv.width, H = cv.height;

let S = {
  char: 'spiderman',
  border: '#f0c040',
  greet: 'eid',
  to: '', from: '', custom: ''
};

const GREETS = {
  eid: 'Eid Mubarak!',
  bangla: 'ঈদ মুবারক',
  arabic: 'عيد مبارك',
  joy: 'Eid Joy!',
  blessings: 'Blessings & Love',
  custom: ''
};

/* ---- THEME BACKGROUNDS ---- */
function bgSpiderman(c) {
  // Golden city bg like the original poster
  let g = c.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#1a0800'); g.addColorStop(0.4, '#7c3a00'); g.addColorStop(1, '#d4770a');
  c.fillStyle = g; c.fillRect(0,0,W,H);
  // City grid lines
  c.strokeStyle = 'rgba(255,180,50,0.18)'; c.lineWidth = 1;
  for(let x=0;x<W;x+=30) { c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
  for(let y=0;y<H;y+=30) { c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
  // Web lines from top
  c.strokeStyle = 'rgba(255,220,100,0.22)'; c.lineWidth = 1.5;
  const wx = W*0.55, wy = -20;
  for(let a=-1.2; a<=0.2; a+=0.18) {
    c.beginPath(); c.moveTo(wx, wy);
    c.lineTo(wx + Math.cos(Math.PI/2+a)*500, wy + Math.sin(Math.PI/2+a)*500);
    c.stroke();
  }
  // Arcs for web
  for(let r=60;r<500;r+=70) {
    c.beginPath(); c.arc(wx, wy, r, 0.3, Math.PI-0.3); c.stroke();
  }
  // Spiderman figure
  drawSpidey(c, W*0.38, H*0.42, 130);
  // Title style text at bottom
  c.fillStyle = 'rgba(0,0,0,0.35)';
  c.fillRect(0, H-55, W, 55);
}

function bgPowerRangers(c) {
  // Red/blue split background
  let g = c.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, '#b71c1c'); g.addColorStop(0.5, '#7b1fa2'); g.addColorStop(1, '#1565c0');
  c.fillStyle = g; c.fillRect(0,0,W,H);
  // Energy blast lines
  c.strokeStyle = 'rgba(255,255,255,0.25)'; c.lineWidth = 2;
  for(let i=0;i<20;i++) {
    let x = (i/20)*W;
    c.beginPath(); c.moveTo(x, H/2);
    c.lineTo(x + (Math.random()-0.5)*200, 0);
    c.stroke();
  }
  // Lightning bolts
  c.strokeStyle = '#ffd740'; c.lineWidth = 3;
  drawLightning(c, W*0.5, 0, W*0.5, H*0.35);
  // Rangers silhouettes
  drawRanger(c, W*0.15, H*0.55, 70, '#ff1744');
  drawRanger(c, W*0.82, H*0.55, 70, '#2979ff');
  drawRanger(c, W*0.5, H*0.5, 90, '#ff1744');
  drawRanger(c, W*0.3, H*0.6, 55, '#ffd740');
  drawRanger(c, W*0.68, H*0.6, 55, '#00e676');
}

function bgDoraemon(c) {
  // Sky blue gradient
  let g = c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#e3f2fd'); g.addColorStop(0.6,'#bbdefb'); g.addColorStop(1,'#90caf9');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // Clouds
  drawCloud(c, 80, 60, 75, 'rgba(255,255,255,0.95)');
  drawCloud(c, W-120, 80, 65, 'rgba(255,255,255,0.9)');
  drawCloud(c, W/2+30, 45, 85, 'rgba(255,255,255,0.85)');
  // Green hill at bottom
  c.fillStyle='#66bb6a';
  c.beginPath(); c.ellipse(W/2, H+10, W*0.75, 70, 0, 0, Math.PI*2); c.fill();
  // Doraemon
  drawDoraFull(c, W*0.5, H*0.56, 110);
  // Stars/sparkles
  for(let i=0;i<10;i++) {
    let sx=(i*173+40)%W, sy=(i*97+30)%150;
    drawStar5(c, sx, sy, 6, '#ffd740');
  }
}

function bgShinchan(c) {
  // Warm orange/yellow sunset
  let g = c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#fff8e1'); g.addColorStop(0.5,'#ffe082'); g.addColorStop(1,'#ffb300');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // Mosque/temple silhouette
  c.fillStyle='rgba(0,0,0,0.12)';
  drawMosqueShape(c, W/2, H-20, 300, 80);
  // Colorful circles
  const cols=['#ff8a65','#81c784','#64b5f6','#f06292','#ba68c8'];
  for(let i=0;i<8;i++) {
    c.globalAlpha=0.2; c.fillStyle=cols[i%5];
    c.beginPath(); c.arc((i*137+60)%W, (i*83+60)%(H*0.6), 22+i*5, 0, Math.PI*2); c.fill();
  }
  c.globalAlpha=1;
  // Shinchan
  drawShinChan(c, W*0.5, H*0.5, 105);
  // Friends around
  drawKid(c, W*0.18, H*0.62, 50, '#ff8a65', '#ffe0b2');
  drawKid(c, W*0.78, H*0.62, 50, '#81c784', '#f1f8e9');
}

function bgBarbie(c) {
  // Pink/purple magical
  let g = c.createRadialGradient(W/2,H/2,50,W/2,H/2,W*0.8);
  g.addColorStop(0,'#fce4ec'); g.addColorStop(0.5,'#f8bbd0'); g.addColorStop(1,'#e1bee7');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // Sparkle dust
  for(let i=0;i<50;i++) {
    let sx=(i*173+20)%W, sy=(i*111+10)%H;
    c.globalAlpha=0.4+0.4*Math.sin(i*1.3);
    c.fillStyle=['#ff80ab','#ea80fc','#fff','#ffd740'][i%4];
    c.beginPath(); c.arc(sx,sy,1.5+Math.sin(i)*1.5,0,Math.PI*2); c.fill();
  }
  c.globalAlpha=1;
  // Barbie figure
  drawBarbieFig(c, W*0.5, H*0.48, 120);
  // Fairy ponies
  drawFairyPony(c, W*0.18, H*0.45, 45, '#ff80ab');
  drawFairyPony(c, W*0.78, H*0.45, 45, '#b39ddb');
}

function bgCinderella(c) {
  let g = c.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#1a237e'); g.addColorStop(0.5,'#283593'); g.addColorStop(1,'#0d47a1');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // Stars
  for(let i=0;i<60;i++) {
    let sx=Math.abs(Math.sin(i*1.618)*W), sy=Math.abs(Math.cos(i*2.718)*H*0.7);
    c.fillStyle=`rgba(255,255,${180+i%75},${0.4+0.5*Math.sin(i*0.7)})`;
    c.beginPath(); c.arc(sx,sy,0.5+Math.sin(i)*1.5,0,Math.PI*2); c.fill();
  }
  // Castle
  drawCastle(c, W*0.75, H*0.35, 90);
  // Cinderella
  drawCinderellaFig(c, W*0.38, H*0.52, 115);
  // Sparkles
  for(let i=0;i<8;i++) {
    drawStar5(c, 80+i*60, 50+i%3*30, 8, '#fff9c4');
  }
}

function bgAladdin(c) {
  // Dark blue night with stars
  c.fillStyle='#0a0520'; c.fillRect(0,0,W,H);
  let g = c.createRadialGradient(W*0.5,0,0,W*0.5,0,H);
  g.addColorStop(0,'rgba(30,10,80,0.8)'); g.addColorStop(1,'transparent');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // Stars
  for(let i=0;i<70;i++) {
    let sx=(i*233)%W, sy=(i*157)%(H*0.65);
    c.fillStyle=`rgba(255,255,200,${0.3+0.7*Math.abs(Math.sin(i*2.1))})`;
    c.beginPath(); c.arc(sx,sy,Math.abs(Math.sin(i))*2,0,Math.PI*2); c.fill();
  }
  // Moon
  drawMoon(c, W*0.82, H*0.18, 45, '#fff9c4');
  // Magic carpet
  drawCarpet(c, W*0.5, H*0.65, 140, 55);
  // Aladdin figure
  drawAladdinFig(c, W*0.5, H*0.46, 105);
  // Genie lamp glow
  c.fillStyle='rgba(255,200,50,0.08)';
  c.beginPath(); c.ellipse(W*0.15, H*0.7, 60, 40, 0, 0, Math.PI*2); c.fill();
  drawLamp(c, W*0.15, H*0.7, 35);
}

function bgSuperman(c) {
  // Dark dramatic
  c.fillStyle='#0a0a15'; c.fillRect(0,0,W,H);
  // City window bg
  c.fillStyle='#111120';
  for(let i=0;i<6;i++) c.fillRect(i*(W/6),0,W/6-3,H);
  // Window lights
  c.fillStyle='rgba(255,220,100,0.12)';
  for(let i=0;i<30;i++) {
    c.fillRect((i%6)*(W/6)+8+(i%3)*12, 20+(i%8)*50, 22, 18);
  }
  // Superman figure
  drawSupermanFig(c, W*0.5, H*0.48, 130);
  // Cape glow
  let cg = c.createRadialGradient(W*0.5, H*0.48, 0, W*0.5, H*0.48, 160);
  cg.addColorStop(0,'rgba(220,50,50,0.0)'); cg.addColorStop(1,'rgba(220,50,50,0.0)');
  c.fillStyle=cg; c.fillRect(0,0,W,H);
}

function bgBatman(c) {
  // Gotham night
  let g = c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#050510'); g.addColorStop(0.5,'#0a0a1a'); g.addColorStop(1,'#1a0a05');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // Bat signal
  drawBatSignal(c, W*0.5, H*0.35, 120);
  // City silhouette
  drawGotham(c);
  // Batman figure
  drawBatmanFig(c, W*0.5, H*0.46, 125);
}

function bgDeadpool(c) {
  // Red/black
  let g = c.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#1a0000'); g.addColorStop(0.5,'#3d0000'); g.addColorStop(1,'#1a0000');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // X pattern
  c.strokeStyle='rgba(200,0,0,0.18)'; c.lineWidth=40;
  c.beginPath(); c.moveTo(0,0); c.lineTo(W,H); c.stroke();
  c.beginPath(); c.moveTo(W,0); c.lineTo(0,H); c.stroke();
  // Chimichangas text (subtle)
  c.fillStyle='rgba(255,0,0,0.06)'; c.font='bold 80px Bangers';
  c.textAlign='center'; c.fillText('CHIMICHANGAS', W/2, H/2+30);
  // Deadpool figure
  drawDeadpoolFig(c, W*0.5, H*0.48, 120);
  // Reading letter pose note
  c.fillStyle='rgba(255,255,255,0.07)';
  c.beginPath(); c.roundRect(W*0.62, H*0.52, 90, 70, 6); c.fill();
  c.strokeStyle='rgba(255,255,255,0.15)'; c.lineWidth=1;
  c.beginPath(); c.roundRect(W*0.62, H*0.52, 90, 70, 6); c.stroke();
  // Lines on letter
  c.strokeStyle='rgba(255,255,255,0.2)'; c.lineWidth=1;
  for(let i=0;i<4;i++) {
    c.beginPath(); c.moveTo(W*0.65, H*0.56+i*12); c.lineTo(W*0.62+80, H*0.56+i*12); c.stroke();
  }
}

/* ---- CHARACTER DRAWERS ---- */

function drawSpidey(c, x, y, r) {
  // Body
  c.fillStyle='#c62828';
  c.beginPath(); c.ellipse(x, y, r*0.45, r*0.6, 0, 0, Math.PI*2); c.fill();
  // Legs spread (climbing pose)
  c.fillStyle='#1565c0';
  // Left leg up
  c.beginPath(); c.moveTo(x-r*0.3, y+r*0.2);
  c.quadraticCurveTo(x-r*0.8, y-r*0.2, x-r*0.9, y-r*0.5); c.lineWidth=r*0.22; c.strokeStyle='#1565c0'; c.stroke();
  // Right leg back
  c.beginPath(); c.moveTo(x+r*0.3, y+r*0.3);
  c.quadraticCurveTo(x+r*0.7, y+r*0.5, x+r*0.5, y+r*0.8); c.stroke();
  // Arms
  c.beginPath(); c.moveTo(x-r*0.35, y-r*0.15);
  c.quadraticCurveTo(x-r*0.9, y-r*0.5, x-r*1.0, y-r*0.8); c.stroke();
  c.strokeStyle='#c62828';
  c.beginPath(); c.moveTo(x+r*0.35, y-r*0.15);
  c.quadraticCurveTo(x+r*0.85, y-r*0.6, x+r*0.95, y-r*0.9); c.stroke();
  // Head
  c.fillStyle='#c62828';
  c.beginPath(); c.arc(x, y-r*0.65, r*0.38, 0, Math.PI*2); c.fill();
  // Web lines on suit
  c.strokeStyle='rgba(0,0,0,0.35)'; c.lineWidth=1;
  for(let i=-3;i<=3;i++) {
    c.beginPath(); c.moveTo(x+i*r*0.14, y-r*0.6); c.lineTo(x+i*r*0.14, y+r*0.5); c.stroke();
  }
  for(let j=-2;j<=2;j++) {
    c.beginPath(); c.arc(x, y-r*0.1, r*(0.2+j*0.12), Math.PI*1.1, Math.PI*1.9); c.stroke();
  }
  // Eye lenses
  c.fillStyle='#fff';
  c.beginPath(); c.ellipse(x-r*0.13, y-r*0.67, r*0.1, r*0.07, -0.3, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.13, y-r*0.67, r*0.1, r*0.07, 0.3, 0, Math.PI*2); c.fill();
  // Web from hand
  c.strokeStyle='rgba(255,255,255,0.7)'; c.lineWidth=1.5;
  c.beginPath(); c.moveTo(x+r*0.95, y-r*0.9); c.lineTo(x+r*1.3, y-r*1.2); c.stroke();
}

function drawRanger(c, x, y, r, col) {
  c.fillStyle=col;
  // Body
  c.beginPath(); c.ellipse(x, y, r*0.38, r*0.5, 0, 0, Math.PI*2); c.fill();
  // Head
  c.beginPath(); c.arc(x, y-r*0.58, r*0.3, 0, Math.PI*2); c.fill();
  // Visor
  c.fillStyle='rgba(0,0,0,0.6)';
  c.beginPath(); c.ellipse(x, y-r*0.58, r*0.22, r*0.12, 0, 0, Math.PI*2); c.fill();
  // Visor shine
  c.fillStyle='rgba(255,255,255,0.3)';
  c.beginPath(); c.ellipse(x-r*0.06, y-r*0.61, r*0.08, r*0.04, -0.3, 0, Math.PI*2); c.fill();
  // Belt
  c.fillStyle='rgba(0,0,0,0.4)';
  c.fillRect(x-r*0.38, y+r*0.05, r*0.76, r*0.1);
  c.fillStyle='#ffd740';
  c.beginPath(); c.arc(x, y+r*0.1, r*0.07, 0, Math.PI*2); c.fill();
  // Legs
  c.fillStyle=col;
  c.fillRect(x-r*0.3, y+r*0.5, r*0.22, r*0.45);
  c.fillRect(x+r*0.08, y+r*0.5, r*0.22, r*0.45);
  // Arms action
  c.beginPath(); c.moveTo(x-r*0.38, y-r*0.1);
  c.quadraticCurveTo(x-r*0.65, y-r*0.3, x-r*0.55, y-r*0.5); c.lineWidth=r*0.18; c.strokeStyle=col; c.stroke();
  c.beginPath(); c.moveTo(x+r*0.38, y-r*0.1);
  c.quadraticCurveTo(x+r*0.65, y-r*0.4, x+r*0.6, y-r*0.6); c.stroke();
}

function drawLightning(c, x1, y1, x2, y2) {
  c.strokeStyle='#ffd740'; c.lineWidth=3;
  c.beginPath(); c.moveTo(x1,y1);
  let steps=8, dx=(x2-x1)/steps, dy=(y2-y1)/steps;
  for(let i=1;i<=steps;i++) {
    c.lineTo(x1+i*dx+(Math.random()-0.5)*40, y1+i*dy);
  }
  c.stroke();
  c.strokeStyle='rgba(255,255,255,0.4)'; c.lineWidth=1;
  c.stroke();
}

function drawCloud(c, x, y, r, col) {
  c.fillStyle=col;
  [[-0.5,0.1,0.45],[0.5,0.1,0.45],[0,0,0.6],[0.25,0.2,0.5],[-0.25,0.25,0.4]].forEach(([dx,dy,fr])=>{
    c.beginPath(); c.arc(x+dx*r, y+dy*r, r*fr, 0, Math.PI*2); c.fill();
  });
}

function drawDoraFull(c, x, y, r) {
  // Shadow
  c.fillStyle='rgba(0,0,0,0.15)';
  c.beginPath(); c.ellipse(x, y+r*0.95, r*0.65, r*0.12, 0, 0, Math.PI*2); c.fill();
  // Body
  c.fillStyle='#1a9fde';
  c.beginPath(); c.ellipse(x, y+r*0.1, r*0.62, r*0.7, 0, 0, Math.PI*2); c.fill();
  // White belly
  c.fillStyle='#fff';
  c.beginPath(); c.ellipse(x, y+r*0.22, r*0.38, r*0.46, 0, 0, Math.PI*2); c.fill();
  // Pocket
  c.strokeStyle='#90caf9'; c.lineWidth=2;
  c.beginPath(); c.ellipse(x, y+r*0.35, r*0.24, r*0.17, 0, 0, Math.PI); c.stroke();
  // Legs
  c.fillStyle='#1a9fde';
  c.beginPath(); c.ellipse(x-r*0.25, y+r*0.82, r*0.2, r*0.15, 0.3, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.25, y+r*0.82, r*0.2, r*0.15, -0.3, 0, Math.PI*2); c.fill();
  // Arms
  c.beginPath(); c.ellipse(x-r*0.82, y, r*0.18, r*0.35, 0.5, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.82, y, r*0.18, r*0.35, -0.5, 0, Math.PI*2); c.fill();
  c.fillStyle='#fff';
  c.beginPath(); c.arc(x-r*0.92, y+r*0.18, r*0.15, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.92, y+r*0.18, r*0.15, 0, Math.PI*2); c.fill();
  // Head
  c.fillStyle='#1a9fde';
  c.beginPath(); c.arc(x, y-r*0.62, r*0.52, 0, Math.PI*2); c.fill();
  // Face white
  c.fillStyle='#fff';
  c.beginPath(); c.arc(x, y-r*0.56, r*0.38, 0, Math.PI*2); c.fill();
  // Eyes
  c.fillStyle='#000';
  c.beginPath(); c.arc(x-r*0.16, y-r*0.72, r*0.11, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.16, y-r*0.72, r*0.11, 0, Math.PI*2); c.fill();
  c.fillStyle='#fff';
  c.beginPath(); c.arc(x-r*0.13, y-r*0.75, r*0.04, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.19, y-r*0.75, r*0.04, 0, Math.PI*2); c.fill();
  // Nose
  c.fillStyle='#f44336';
  c.beginPath(); c.arc(x, y-r*0.56, r*0.09, 0, Math.PI*2); c.fill();
  // Whiskers
  c.strokeStyle='#333'; c.lineWidth=1.5;
  for(let i=-1;i<=1;i++) {
    c.beginPath(); c.moveTo(x-r*0.07, y-r*0.49+i*r*0.07); c.lineTo(x-r*0.45, y-r*0.52+i*r*0.05); c.stroke();
    c.beginPath(); c.moveTo(x+r*0.07, y-r*0.49+i*r*0.07); c.lineTo(x+r*0.45, y-r*0.52+i*r*0.05); c.stroke();
  }
  // Collar
  c.fillStyle='#f44336';
  c.beginPath(); c.arc(x, y-r*0.14, r*0.58, 0.4, Math.PI-0.4); c.fill();
  c.fillStyle='#ffd740';
  c.beginPath(); c.arc(x, y-r*0.12, r*0.12, 0, Math.PI*2); c.fill();
}

function drawShinChan(c, x, y, r) {
  // Shadow
  c.fillStyle='rgba(0,0,0,0.12)';
  c.beginPath(); c.ellipse(x, y+r*0.95, r*0.6, r*0.1, 0, 0, Math.PI*2); c.fill();
  // Legs
  c.fillStyle='#ffe0b2';
  c.beginPath(); c.ellipse(x-r*0.22, y+r*0.75, r*0.18, r*0.28, 0.1, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.22, y+r*0.75, r*0.18, r*0.28, -0.1, 0, Math.PI*2); c.fill();
  // Shoes
  c.fillStyle='#ffd600';
  c.beginPath(); c.ellipse(x-r*0.24, y+r*0.97, r*0.2, r*0.1, 0.1, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.24, y+r*0.97, r*0.2, r*0.1, -0.1, 0, Math.PI*2); c.fill();
  // Red top
  c.fillStyle='#e53935';
  c.beginPath(); c.ellipse(x, y, r*0.52, r*0.48, 0, 0, Math.PI*2); c.fill();
  // White collar
  c.fillStyle='#fff';
  c.beginPath(); c.ellipse(x, y-r*0.35, r*0.22, r*0.1, 0, 0, Math.PI*2); c.fill();
  // Arms
  c.fillStyle='#ffe0b2';
  c.beginPath(); c.ellipse(x-r*0.62, y-r*0.05, r*0.18, r*0.32, 0.4, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.62, y-r*0.05, r*0.18, r*0.32, -0.4, 0, Math.PI*2); c.fill();
  // Hands (action pose - right hand forward)
  c.beginPath(); c.arc(x+r*0.78, y+r*0.1, r*0.17, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x-r*0.72, y+r*0.05, r*0.15, 0, Math.PI*2); c.fill();
  // Head
  c.fillStyle='#ffe0b2';
  c.beginPath(); c.arc(x, y-r*0.62, r*0.46, 0, Math.PI*2); c.fill();
  // Hair (5 spikes)
  c.fillStyle='#1a1a1a';
  for(let i=0;i<5;i++) {
    let a = Math.PI+0.2 + i*0.3;
    c.beginPath();
    c.ellipse(x+Math.cos(a)*r*0.3, y-r*0.62+Math.sin(a)*r*0.3, r*0.1, r*0.18, a+Math.PI/2, 0, Math.PI*2);
    c.fill();
  }
  // Big eyes
  c.fillStyle='#fff';
  c.beginPath(); c.arc(x-r*0.18, y-r*0.66, r*0.15, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.18, y-r*0.66, r*0.15, 0, Math.PI*2); c.fill();
  c.fillStyle='#1a1a1a';
  c.beginPath(); c.arc(x-r*0.17, y-r*0.66, r*0.1, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.19, y-r*0.66, r*0.1, 0, Math.PI*2); c.fill();
  // Shine
  c.fillStyle='#fff';
  c.beginPath(); c.arc(x-r*0.14, y-r*0.69, r*0.04, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.22, y-r*0.69, r*0.04, 0, Math.PI*2); c.fill();
  // Mouth (big open)
  c.fillStyle='#c62828';
  c.beginPath(); c.arc(x, y-r*0.53, r*0.18, 0, Math.PI); c.fill();
  c.fillStyle='#fff';
  c.beginPath(); c.arc(x, y-r*0.53, r*0.12, 0.1, Math.PI-0.1); c.fill();
  // Eyebrows
  c.strokeStyle='#1a1a1a'; c.lineWidth=3;
  c.beginPath(); c.moveTo(x-r*0.3, y-r*0.75); c.lineTo(x-r*0.06, y-r*0.78); c.stroke();
  c.beginPath(); c.moveTo(x+r*0.06, y-r*0.78); c.lineTo(x+r*0.3, y-r*0.75); c.stroke();
}

function drawKid(c, x, y, r, bodyCol, skinCol) {
  c.fillStyle=skinCol;
  c.beginPath(); c.arc(x, y-r*0.6, r*0.35, 0, Math.PI*2); c.fill();
  c.fillStyle=bodyCol;
  c.beginPath(); c.ellipse(x, y, r*0.38, r*0.45, 0, 0, Math.PI*2); c.fill();
  c.fillStyle='#1a1a1a';
  c.beginPath(); c.arc(x-r*0.12, y-r*0.63, r*0.07, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.12, y-r*0.63, r*0.07, 0, Math.PI*2); c.fill();
}

function drawBarbieFig(c, x, y, r) {
  // Gown sparkle
  let gg = c.createRadialGradient(x, y+r*0.3, 0, x, y+r*0.3, r*0.9);
  gg.addColorStop(0,'#ff80ab'); gg.addColorStop(0.5,'#e91e8c'); gg.addColorStop(1,'#ad1457');
  c.fillStyle=gg;
  c.beginPath();
  c.moveTo(x, y);
  c.bezierCurveTo(x-r*0.6, y+r*0.3, x-r*1.0, y+r*1.1, x, y+r*1.15);
  c.bezierCurveTo(x+r*1.0, y+r*1.1, x+r*0.6, y+r*0.3, x, y);
  c.fill();
  // Sparkles on gown
  c.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<12;i++) {
    let gx=x+(Math.sin(i*1.9)*r*0.7), gy=y+r*0.4+(i%4)*r*0.18;
    drawStar5(c, gx, gy, 4, 'rgba(255,255,255,0.7)');
  }
  // Torso
  c.fillStyle='#ffb3c1';
  c.beginPath(); c.ellipse(x, y-r*0.05, r*0.28, r*0.42, 0, 0, Math.PI*2); c.fill();
  // Arms
  c.fillStyle='#fce4ec';
  c.beginPath(); c.ellipse(x-r*0.42, y-r*0.08, r*0.14, r*0.35, 0.4, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.38, y-r*0.15, r*0.14, r*0.35, -0.5, 0, Math.PI*2); c.fill();
  // Head
  c.fillStyle='#fce4ec';
  c.beginPath(); c.arc(x, y-r*0.62, r*0.3, 0, Math.PI*2); c.fill();
  // Hair
  c.fillStyle='#ffd54f';
  c.beginPath();
  c.arc(x, y-r*0.62, r*0.32, Math.PI, 0); c.fill();
  c.beginPath(); c.ellipse(x-r*0.28, y-r*0.4, r*0.1, r*0.35, -0.3, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.28, y-r*0.4, r*0.1, r*0.35, 0.3, 0, Math.PI*2); c.fill();
  // Eyes
  c.fillStyle='#1565c0';
  c.beginPath(); c.arc(x-r*0.1, y-r*0.64, r*0.07, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.1, y-r*0.64, r*0.07, 0, Math.PI*2); c.fill();
  c.fillStyle='#fff';
  c.beginPath(); c.arc(x-r*0.07, y-r*0.67, r*0.025, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.13, y-r*0.67, r*0.025, 0, Math.PI*2); c.fill();
  // Smile
  c.strokeStyle='#c2185b'; c.lineWidth=2;
  c.beginPath(); c.arc(x, y-r*0.55, r*0.1, 0.2, Math.PI-0.2); c.stroke();
  // Crown
  c.fillStyle='#ffd740';
  c.beginPath();
  c.moveTo(x-r*0.18, y-r*0.88);
  c.lineTo(x-r*0.14, y-r*0.98); c.lineTo(x, y-r*0.92);
  c.lineTo(x+r*0.14, y-r*0.98); c.lineTo(x+r*0.18, y-r*0.88);
  c.closePath(); c.fill();
}

function drawFairyPony(c, x, y, r, col) {
  c.fillStyle=col;
  c.beginPath(); c.ellipse(x, y, r*0.8, r*0.5, 0, 0, Math.PI*2); c.fill();
  // Head
  c.beginPath(); c.arc(x+r*0.7, y-r*0.1, r*0.35, 0, Math.PI*2); c.fill();
  // Horn
  c.fillStyle='#ffd740';
  c.beginPath();
  c.moveTo(x+r*0.7, y-r*0.44);
  c.lineTo(x+r*0.64, y-r*0.26); c.lineTo(x+r*0.76, y-r*0.26); c.closePath(); c.fill();
  // Wings
  c.fillStyle='rgba(255,255,255,0.6)';
  c.beginPath(); c.ellipse(x-r*0.1, y-r*0.3, r*0.55, r*0.25, -0.5, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x-r*0.1, y-r*0.1, r*0.45, r*0.2, 0.5, 0, Math.PI*2); c.fill();
  // Eye
  c.fillStyle='#fff'; c.beginPath(); c.arc(x+r*0.82, y-r*0.12, r*0.1, 0, Math.PI*2); c.fill();
  c.fillStyle='#1a1a1a'; c.beginPath(); c.arc(x+r*0.82, y-r*0.12, r*0.06, 0, Math.PI*2); c.fill();
  // Mane
  c.fillStyle='rgba(255,255,255,0.8)';
  c.beginPath(); c.ellipse(x+r*0.5, y-r*0.18, r*0.1, r*0.28, -0.4, 0, Math.PI*2); c.fill();
}

function drawCinderellaFig(c, x, y, r) {
  // Gown (blue)
  let bg2 = c.createRadialGradient(x, y+r*0.3, 0, x, y+r*0.3, r);
  bg2.addColorStop(0,'#90caf9'); bg2.addColorStop(0.6,'#1565c0'); bg2.addColorStop(1,'#0d47a1');
  c.fillStyle=bg2;
  c.beginPath();
  c.moveTo(x, y);
  c.bezierCurveTo(x-r*0.7, y+r*0.25, x-r*1.1, y+r*1.0, x, y+r*1.1);
  c.bezierCurveTo(x+r*1.1, y+r*1.0, x+r*0.7, y+r*0.25, x, y);
  c.fill();
  // Sparkles
  for(let i=0;i<10;i++) {
    drawStar5(c, x+(Math.sin(i*2)*r*0.8), y+r*0.4+(i%4)*r*0.18, 4, 'rgba(255,255,255,0.7)');
  }
  // Bodice
  c.fillStyle='#bbdefb';
  c.beginPath(); c.ellipse(x, y-r*0.1, r*0.25, r*0.4, 0, 0, Math.PI*2); c.fill();
  // Glove arms
  c.fillStyle='#fff';
  c.beginPath(); c.ellipse(x-r*0.4, y-r*0.08, r*0.12, r*0.32, 0.4, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.35, y-r*0.15, r*0.12, r*0.32, -0.5, 0, Math.PI*2); c.fill();
  // Neck/head
  c.fillStyle='#fce4ec';
  c.beginPath(); c.arc(x, y-r*0.6, r*0.29, 0, Math.PI*2); c.fill();
  // Hair
  c.fillStyle='#ffd54f';
  c.beginPath(); c.arc(x, y-r*0.6, r*0.31, Math.PI*1.1, Math.PI*2-0.1); c.fill();
  c.beginPath(); c.ellipse(x, y-r*0.62, r*0.31, r*0.16, 0, Math.PI, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x-r*0.28, y-r*0.42, r*0.1, r*0.3, -0.2, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.28, y-r*0.42, r*0.1, r*0.3, 0.2, 0, Math.PI*2); c.fill();
  // Eyes
  c.fillStyle='#1565c0';
  c.beginPath(); c.arc(x-r*0.1, y-r*0.62, r*0.065, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.1, y-r*0.62, r*0.065, 0, Math.PI*2); c.fill();
  c.fillStyle='#fff';
  c.beginPath(); c.arc(x-r*0.08, y-r*0.64, r*0.02, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.12, y-r*0.64, r*0.02, 0, Math.PI*2); c.fill();
  // Smile
  c.strokeStyle='#e91e8c'; c.lineWidth=1.5;
  c.beginPath(); c.arc(x, y-r*0.54, r*0.09, 0.2, Math.PI-0.2); c.stroke();
  // Tiara
  c.fillStyle='#ffd740';
  c.beginPath();
  c.moveTo(x-r*0.16, y-r*0.85); c.lineTo(x-r*0.1, y-r*0.95);
  c.lineTo(x, y-r*0.88); c.lineTo(x+r*0.1, y-r*0.95);
  c.lineTo(x+r*0.16, y-r*0.85); c.closePath(); c.fill();
}

function drawCastle(c, x, y, r) {
  c.fillStyle='rgba(100,130,220,0.4)';
  c.fillRect(x-r*0.8, y-r*0.5, r*1.6, r*0.8);
  // Towers
  c.fillRect(x-r*0.9, y-r*0.8, r*0.4, r);
  c.fillRect(x+r*0.5, y-r*0.8, r*0.4, r);
  c.fillRect(x-r*0.2, y-r*1.0, r*0.4, r*1.2);
  // Turrets
  [[x-r*0.7, y-r*0.8],[x+r*0.7, y-r*0.8],[x, y-r*1.0]].forEach(([tx,ty])=>{
    c.beginPath(); c.arc(tx,ty,r*0.22, Math.PI, 0); c.fill();
  });
  // Windows
  c.fillStyle='rgba(255,220,100,0.5)';
  c.beginPath(); c.arc(x, y-r*0.3, r*0.12, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x-r*0.5, y-r*0.2, r*0.1, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.5, y-r*0.2, r*0.1, 0, Math.PI*2); c.fill();
}

function drawCarpet(c, x, y, w2, h2) {
  c.fillStyle='#6a1b9a';
  c.beginPath(); c.ellipse(x, y, w2/2, h2/2, 0, 0, Math.PI*2); c.fill();
  // Pattern
  c.strokeStyle='#ffd740'; c.lineWidth=2;
  c.beginPath(); c.ellipse(x, y, w2/2-8, h2/2-5, 0, 0, Math.PI*2); c.stroke();
  c.strokeStyle='#e91e8c'; c.lineWidth=1.5;
  c.beginPath(); c.ellipse(x, y, w2/4, h2/4, 0, 0, Math.PI*2); c.stroke();
  // Tassels
  c.fillStyle='#ffd740';
  for(let i=-2;i<=2;i++) { c.beginPath(); c.arc(x+i*w2/5, y-h2/2, 4, 0, Math.PI*2); c.fill(); }
  for(let i=-2;i<=2;i++) { c.beginPath(); c.arc(x+i*w2/5, y+h2/2, 4, 0, Math.PI*2); c.fill(); }
}

function drawSupermanFig(c, x, y, r) {
  // Cape (billowing behind)
  c.fillStyle='#c62828';
  c.beginPath();
  c.moveTo(x+r*0.3, y-r*0.4);

  c.bezierCurveTo(x+r*0.2, y+r*0.6, x+r*0.1, y+r*0.2, x+r*0.3, y-r*0.4);
  c.fill();
  // Blue suit body
  c.fillStyle='#1565c0';
  c.beginPath(); c.ellipse(x, y, r*0.42, r*0.58, 0, 0, Math.PI*2); c.fill();
  // Red trunks
  c.fillStyle='#c62828';
  c.beginPath(); c.ellipse(x, y+r*0.2, r*0.42, r*0.22, 0, 0, Math.PI*2); c.fill();
  // Yellow belt
  c.fillStyle='#ffd740';
  c.fillRect(x-r*0.42, y+r*0.1, r*0.84, r*0.1);
  // S shield
  c.fillStyle='#ffd740';
  c.beginPath(); c.roundRect(x-r*0.18, y-r*0.22, r*0.36, r*0.42, 6); c.fill();
  c.fillStyle='#c62828';
  c.beginPath();
  c.moveTo(x-r*0.12, y-r*0.18); c.lineTo(x+r*0.14, y-r*0.18);
  c.lineTo(x+r*0.04, y-r*0.02); c.lineTo(x+r*0.14, y+r*0.14);
  c.lineTo(x-r*0.12, y+r*0.14); c.lineTo(x-r*0.04, y-r*0.02); c.closePath(); c.fill();
  // Boots
  c.fillStyle='#c62828';
  c.beginPath(); c.ellipse(x-r*0.18, y+r*0.8, r*0.18, r*0.15, 0.1, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.18, y+r*0.8, r*0.18, r*0.15, -0.1, 0, Math.PI*2); c.fill();
  c.fillStyle='#1565c0';
  c.fillRect(x-r*0.3, y+r*0.55, r*0.22, r*0.3);
  c.fillRect(x+r*0.08, y+r*0.55, r*0.22, r*0.3);
  // Arms
  c.fillStyle='#1565c0';
  c.beginPath(); c.ellipse(x-r*0.62, y-r*0.1, r*0.18, r*0.38, 0.35, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.62, y-r*0.2, r*0.18, r*0.38, -0.4, 0, Math.PI*2); c.fill();
  // Fists (flying pose)
  c.fillStyle='#fce4ec';
  c.beginPath(); c.arc(x-r*0.75, y+r*0.1, r*0.15, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.75, y-r*0.02, r*0.15, 0, Math.PI*2); c.fill();
  // Head
  c.fillStyle='#fce4ec';
  c.beginPath(); c.arc(x, y-r*0.68, r*0.33, 0, Math.PI*2); c.fill();
  // Hair dark
  c.fillStyle='#1a1a1a';
  c.beginPath(); c.arc(x, y-r*0.68, r*0.35, Math.PI*1.1, Math.PI*2-0.1); c.fill();
  // Superman curl
  c.beginPath(); c.arc(x, y-r*0.88, r*0.1, 0, Math.PI); c.fill();
  // Eyes
  c.fillStyle='#1565c0';
  c.beginPath(); c.arc(x-r*0.12, y-r*0.7, r*0.07, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.12, y-r*0.7, r*0.07, 0, Math.PI*2); c.fill();
  c.fillStyle='#fff';
  c.beginPath(); c.arc(x-r*0.09, y-r*0.72, r*0.025, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.14, y-r*0.72, r*0.025, 0, Math.PI*2); c.fill();
  // Strong jaw/chin
  c.strokeStyle='rgba(0,0,0,0.15)'; c.lineWidth=1.5;
  c.beginPath(); c.arc(x, y-r*0.58, r*0.25, 0.1, Math.PI-0.1); c.stroke();
}

function drawBatmanFig(c, x, y, r) {
  // Cape spread wide
  c.fillStyle='#1a1a1a';
  c.beginPath();
  c.moveTo(x, y-r*0.1);
  c.bezierCurveTo(x-r*1.3, y-r*0.5, x-r*1.5, y+r*0.5, x-r*0.3, y+r*0.9);
  c.bezierCurveTo(x-r*0.1, y+r*0.5, x, y+r*0.3, x, y+r*0.1);
  c.fill();
  c.beginPath();
  c.moveTo(x, y-r*0.1);
  c.bezierCurveTo(x+r*1.3, y-r*0.5, x+r*1.5, y+r*0.5, x+r*0.3, y+r*0.9);
  c.bezierCurveTo(x+r*0.1, y+r*0.5, x, y+r*0.3, x, y+r*0.1);
  c.fill();
  // Body
  c.fillStyle='#2a2a2a';
  c.beginPath(); c.ellipse(x, y, r*0.38, r*0.55, 0, 0, Math.PI*2); c.fill();
  // Bat symbol chest
  c.fillStyle='#ffd740';
  c.beginPath();
  c.ellipse(x, y-r*0.05, r*0.28, r*0.14, 0, 0, Math.PI*2); c.fill();
  c.fillStyle='#2a2a2a';
  c.beginPath(); c.arc(x, y-r*0.05, r*0.12, 0, Math.PI*2); c.fill();
  c.fillStyle='#ffd740';
  // Bat wing cuts
  c.beginPath(); c.ellipse(x-r*0.14, y-r*0.05, r*0.1, r*0.07, -0.5, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.14, y-r*0.05, r*0.1, r*0.07, 0.5, 0, Math.PI*2); c.fill();
  // Belt
  c.fillStyle='#ffd740';
  c.fillRect(x-r*0.38, y+r*0.15, r*0.76, r*0.1);
  // Legs
  c.fillStyle='#2a2a2a';
  c.fillRect(x-r*0.3, y+r*0.55, r*0.22, r*0.42);
  c.fillRect(x+r*0.08, y+r*0.55, r*0.22, r*0.42);
  // Arms
  c.beginPath(); c.ellipse(x-r*0.6, y-r*0.1, r*0.16, r*0.36, 0.3, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.6, y-r*0.1, r*0.16, r*0.36, -0.3, 0, Math.PI*2); c.fill();
  // Fists
  c.beginPath(); c.arc(x-r*0.7, y+r*0.1, r*0.13, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.7, y+r*0.1, r*0.13, 0, Math.PI*2); c.fill();
  // Head + cowl
  c.fillStyle='#1a1a1a';
  c.beginPath(); c.arc(x, y-r*0.65, r*0.34, 0, Math.PI*2); c.fill();
  // Bat ears
  c.beginPath();
  c.moveTo(x-r*0.22, y-r*0.88);
  c.lineTo(x-r*0.32, y-r*1.08);
  c.lineTo(x-r*0.08, y-r*0.9);
  c.closePath(); c.fill();
  c.beginPath();
  c.moveTo(x+r*0.22, y-r*0.88);
  c.lineTo(x+r*0.32, y-r*1.08);
  c.lineTo(x+r*0.08, y-r*0.9);
  c.closePath(); c.fill();
  // White eyes
  c.fillStyle='#fff';
  c.beginPath(); c.ellipse(x-r*0.12, y-r*0.67, r*0.1, r*0.065, -0.2, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.12, y-r*0.67, r*0.1, r*0.065, 0.2, 0, Math.PI*2); c.fill();
  // Grapple hook
  c.strokeStyle='rgba(255,215,64,0.5)'; c.lineWidth=1.5;
  c.beginPath(); c.moveTo(x-r*0.7, y+r*0.1); c.lineTo(x-r*1.3, y-r*0.6); c.stroke();
}

function drawBatSignal(c, x, y, r) {
  // Moon/light beam
  let lg = c.createRadialGradient(x, y, 0, x, y, r*2.5);
  lg.addColorStop(0,'rgba(255,200,50,0.25)');
  lg.addColorStop(0.5,'rgba(255,200,50,0.08)');
  lg.addColorStop(1,'transparent');
  c.fillStyle=lg; c.beginPath(); c.arc(x,y,r*2.5,0,Math.PI*2); c.fill();
  // Yellow circle
  c.fillStyle='rgba(255,215,64,0.15)';
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill();
  c.strokeStyle='rgba(255,215,64,0.3)'; c.lineWidth=3;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.stroke();
  // Bat silhouette
  c.fillStyle='rgba(10,10,20,0.7)';
  c.beginPath();
  c.ellipse(x, y+r*0.1, r*0.42, r*0.2, 0, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x, y, r*0.2, 0, Math.PI*2); c.fill();
  c.beginPath();
  c.moveTo(x-r*0.42, y+r*0.1);
  c.bezierCurveTo(x-r*0.6, y-r*0.15, x-r*0.45, y-r*0.32, x-r*0.22, y-r*0.18);
  c.bezierCurveTo(x-r*0.1, y-r*0.08, x, y, x, y);
  c.bezierCurveTo(x+r*0.1, y-r*0.08, x+r*0.22, y-r*0.18, x+r*0.45, y-r*0.32);
  c.bezierCurveTo(x+r*0.6, y-r*0.15, x+r*0.42, y+r*0.1, x+r*0.42, y+r*0.1);
  c.fill();
  // Ears (bat ears on signal)
  c.beginPath(); c.moveTo(x-r*0.16, y-r*0.18); c.lineTo(x-r*0.24, y-r*0.4); c.lineTo(x-r*0.04, y-r*0.22); c.fill();
  c.beginPath(); c.moveTo(x+r*0.16, y-r*0.18); c.lineTo(x+r*0.24, y-r*0.4); c.lineTo(x+r*0.04, y-r*0.22); c.fill();
}

function drawGotham(c) {
  c.fillStyle='rgba(20,10,5,0.85)';
  const buildings=[[0,120,80],[70,90,60],[120,140,70],[180,100,50],[230,160,90],[310,80,60],[360,130,80],[440,110,55],[500,150,100]];
  buildings.forEach(([bx,bh,bw])=>{
    c.fillRect(bx, H-bh, bw, bh);
    // Windows
    c.fillStyle='rgba(255,180,50,0.2)';
    for(let wx=bx+8;wx<bx+bw-8;wx+=16) {
      for(let wy=H-bh+10;wy<H-15;wy+=20) {
        if(Math.random()>0.4) c.fillRect(wx, wy, 10, 12);
      }
    }
    c.fillStyle='rgba(20,10,5,0.85)';
  });
}

function drawDeadpoolFig(c, x, y, r) {
  // Body - red suit
  c.fillStyle='#c62828';
  c.beginPath(); c.ellipse(x, y, r*0.42, r*0.55, 0, 0, Math.PI*2); c.fill();
  // Black accents on suit
  c.fillStyle='#1a1a1a';
  c.beginPath(); c.ellipse(x, y, r*0.18, r*0.45, 0, 0, Math.PI*2); c.fill();
  // Belt
  c.fillStyle='#333'; c.fillRect(x-r*0.42, y+r*0.15, r*0.84, r*0.1);
  c.fillStyle='#888'; c.beginPath(); c.arc(x, y+r*0.2, r*0.07, 0, Math.PI*2); c.fill();
  // Legs
  c.fillStyle='#c62828';
  c.fillRect(x-r*0.3, y+r*0.55, r*0.22, r*0.42);

  c.fillRect(x-r*0.3, y+r*0.85, r*0.22, r*0.12);

  c.fillStyle='#c62828';
  c.beginPath(); c.ellipse(x-r*0.6, y+r*0.1, r*0.16, r*0.35, 0.5, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.6, y+r*0.1, r*0.16, r*0.35, -0.5, 0, Math.PI*2); c.fill();
  // Gloved hands on knees
  c.fillStyle='#1a1a1a';
  c.beginPath(); c.arc(x-r*0.68, y+r*0.38, r*0.15, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+r*0.68, y+r*0.38, r*0.15, 0, Math.PI*2); c.fill();
  // Head (big round mask)
  c.fillStyle='#c62828';
  c.beginPath(); c.arc(x, y-r*0.65, r*0.36, 0, Math.PI*2); c.fill();
  // Black eye patches (signature Deadpool look)
  c.fillStyle='#1a1a1a';
  c.beginPath(); c.ellipse(x-r*0.14, y-r*0.67, r*0.16, r*0.12, -0.2, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.14, y-r*0.67, r*0.16, r*0.12, 0.2, 0, Math.PI*2); c.fill();
  // White eyes (in the black patches)
  c.fillStyle='#fff';
  c.beginPath(); c.ellipse(x-r*0.14, y-r*0.67, r*0.1, r*0.08, -0.2, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.14, y-r*0.67, r*0.1, r*0.08, 0.2, 0, Math.PI*2); c.fill();
  // Squinting expression - line through eyes
  c.fillStyle='#1a1a1a';
  c.beginPath(); c.ellipse(x-r*0.14, y-r*0.67, r*0.1, r*0.03, -0.2, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+r*0.14, y-r*0.67, r*0.1, r*0.03, 0.2, 0, Math.PI*2); c.fill();
  // Head tilt (looking at card he's reading)
  // Swords on back
  c.strokeStyle='#888'; c.lineWidth=4;
  c.beginPath(); c.moveTo(x-r*0.15, y-r*1.05); c.lineTo(x-r*0.1, y+r*0.1); c.stroke();
  c.beginPath(); c.moveTo(x+r*0.15, y-r*1.05); c.lineTo(x+r*0.1, y+r*0.1); c.stroke();
  c.strokeStyle='#bbb'; c.lineWidth=2;
  c.beginPath(); c.moveTo(x-r*0.15, y-r*1.05); c.lineTo(x-r*0.1, y+r*0.1); c.stroke();
  c.beginPath(); c.moveTo(x+r*0.15, y-r*1.05); c.lineTo(x+r*0.1, y+r*0.1); c.stroke();
}

/* ---- SHARED HELPERS ---- */
function drawStar5(c, x, y, r, col) {
  c.fillStyle=col;
  c.beginPath();
  for(let i=0;i<5;i++) {
    let a=Math.PI/2+i*Math.PI*2/5, a2=a+Math.PI/5;
    if(i===0) c.moveTo(x+Math.cos(a)*r, y-Math.sin(a)*r);
    else c.lineTo(x+Math.cos(a)*r, y-Math.sin(a)*r);
    c.lineTo(x+Math.cos(a2)*r*0.4, y-Math.sin(a2)*r*0.4);
  }
  c.closePath(); c.fill();
}
function drawMoon(c, x, y, r, col) {
  c.fillStyle=col;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill();
  c.save(); c.globalCompositeOperation='destination-out';
  c.fillStyle='rgba(0,0,0,0.999)';
  c.beginPath(); c.arc(x+r*0.45, y-r*0.1, r*0.82, 0, Math.PI*2); c.fill();
  c.restore();
  // glow
  let gg = c.createRadialGradient(x, y, r*0.5, x, y, r*2.5);
  gg.addColorStop(0, 'rgba(255,249,196,0.3)');
  gg.addColorStop(1, 'transparent');
  c.fillStyle=gg; c.beginPath(); c.arc(x, y, r*2.5, 0, Math.PI*2); c.fill();
}
function drawMosqueShape(c, x, y, w2, h2) {
  c.fillRect(x-w2/2, y-h2*0.3, w2, h2*0.3);
  c.beginPath(); c.arc(x, y-h2*0.3, h2*0.38, Math.PI, 0); c.fill();
  c.beginPath(); c.arc(x-w2*0.28, y-h2*0.3, h2*0.24, Math.PI, 0); c.fill();
  c.beginPath(); c.arc(x+w2*0.28, y-h2*0.3, h2*0.24, Math.PI, 0); c.fill();
  c.fillRect(x-w2*0.48, y-h2*0.9, h2*0.08, h2*0.62);
  c.fillRect(x+w2*0.42, y-h2*0.9, h2*0.08, h2*0.62);
}

/* ---- BORDER ---- */
function drawBorder(c, col) {
  // Outer thick
  c.strokeStyle=col; c.lineWidth=7;
  c.strokeRect(6, 6, W-12, H-12);
  // Inner thin
  c.lineWidth=1.5;
  c.strokeRect(16, 16, W-32, H-32);
  // Corner ornaments
  [[18,18],[W-18,18],[18,H-18],[W-18,H-18]].forEach(([cx,cy])=>{
    c.fillStyle=col;
    c.save(); c.translate(cx,cy); c.rotate(Math.PI/4);
    c.fillRect(-7,-7,14,14);
    c.restore();
    c.fillStyle='#0e0b1a';
    c.beginPath(); c.arc(cx, cy, 5, 0, Math.PI*2); c.fill();
    c.fillStyle=col;
    c.beginPath(); c.arc(cx, cy, 3, 0, Math.PI*2); c.fill();
  });
  // Mid-border dots
  [W/2, W/4, W*3/4].forEach(mx => {
    c.fillStyle=col;
    c.beginPath(); c.arc(mx, 6, 4, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(mx, H-6, 4, 0, Math.PI*2); c.fill();
  });
  [H/2, H/4, H*3/4].forEach(my => {
    c.beginPath(); c.arc(6, my, 4, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(W-6, my, 4, 0, Math.PI*2); c.fill();
  });
}

/* ---- TEXT ---- */
function drawText(c, greetText) {
  const lines = greetText.split('\n');
  const isLight = ['barbie','cinderella','shinchan'].includes(S.char);
  const isBangla = S.greet==='bangla';
  const isArabic = S.greet==='arabic';
  const font = (isBangla||isArabic) ? "'Amiri', serif" : "'Bangers', cursive";
  const maxLen = Math.max(...lines.map(l=>l.length));
  const fs = maxLen > 20 ? 30 : maxLen > 14 ? 38 : maxLen > 8 ? 44 : 52;

  c.save();
  c.textAlign='center'; c.textBaseline='middle';

  const lineH = fs + 8;
  const totalH = lines.length * lineH + 20;
  const bY = H - 80;

  // Banner bg
  c.fillStyle='rgba(0,0,0,0.35)';
  c.beginPath();
  c.roundRect(W*0.08, bY - totalH/2 - 8, W*0.84, totalH + 16, 12);
  c.fill();
  // Banner top/bottom lines
  c.strokeStyle=S.border; c.lineWidth=1.5;
  c.beginPath();
  c.roundRect(W*0.08, bY - totalH/2 - 8, W*0.84, totalH + 16, 12);
  c.stroke();

  lines.forEach((line, i) => {
    const ly = bY + (i - (lines.length-1)/2) * lineH;
    c.font = `bold ${fs}px ${font}`;
    // Shadow
    c.fillStyle='rgba(0,0,0,0.5)';
    c.fillText(line, W/2+2, ly+2);
    // Main text
    c.fillStyle=S.border;
    c.fillText(line, W/2, ly);
  });
  c.restore();

  // To / From
  c.save();
  c.font = "italic 16px 'Dancing Script', cursive";
  c.fillStyle='rgba(255,255,255,0.82)';
  if(S.to) { c.textAlign='left'; c.fillText('To: '+S.to, 26, H-38); }
  if(S.from) { c.textAlign='right'; c.fillText('From: '+S.from, W-26, H-20); }
  c.restore();
}

/* ---- RENDER ---- */
const themes = {
  spiderman: bgSpiderman, powerrangers: bgPowerRangers,
  doraemon: bgDoraemon, shinchan: bgShinchan,
  barbie: bgBarbie, cinderella: bgCinderella,
  aladdin: bgAladdin, superman: bgSuperman,
  batman: bgBatman, deadpool: bgDeadpool
};

function render() {
  S.to = document.getElementById('toName').value;
  S.from = document.getElementById('fromName').value;
  S.custom = document.getElementById('customText').value;

  cx.clearRect(0,0,W,H);
  (themes[S.char]||bgSpiderman)(cx);
  drawBorder(cx, S.border);
  const greetTxt = S.greet==='custom' ? (S.custom||'Eid Mubarak!') : GREETS[S.greet];
  drawText(cx, greetTxt);
}

function dl() {
  render();
  const a = document.createElement('a');
  a.download = 'eidchithi-card.png';
  a.href = cv.toDataURL('image/png');
  a.click();
}

/* ---- UI EVENTS ---- */
document.getElementById('charGrid').addEventListener('click', e => {
  const b = e.target.closest('.char-btn'); if(!b) return;
  document.querySelectorAll('.char-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  S.char = b.dataset.char;
  render();
});
document.getElementById('swatches').addEventListener('click', e => {
  const s = e.target.closest('.swatch'); if(!s) return;
  document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));
  s.classList.add('active');
  S.border = s.dataset.c;
  render();
});
document.getElementById('greetGrid').addEventListener('click', e => {
  const b = e.target.closest('.greet-btn'); if(!b) return;
  document.querySelectorAll('.greet-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  S.greet = b.dataset.g;
  document.getElementById('customBox').style.display = S.greet==='custom'?'block':'none';
  render();
});
['toName','fromName','customText'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});

render();
</script>
